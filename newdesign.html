<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Training</title>
<meta name="theme-color" content="#0c0c0e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Training">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0c0e;--surface:#16161b;--surface-2:#1e1e25;--line:#2a2a33;
  --text:#f3f3ee;--muted:#86868f;--accent:#cdfd34;
  --push:#ff6a3d;--pull:#4ea8ff;--legs:#cdfd34;--rest:#6b7780;--radius:18px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--text);font-family:'Sora',sans-serif;}
body{min-height:100vh;padding:22px 16px calc(90px + env(safe-area-inset-bottom,0px));overflow-x:hidden;
  background:radial-gradient(120% 60% at 80% -5%,rgba(205,253,52,.10),transparent 55%),
    radial-gradient(90% 50% at -10% 10%,rgba(78,168,255,.07),transparent 60%),var(--bg);
  background-attachment:fixed;}
.wrap{max-width:520px;margin:0 auto;}
/* Header */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.brand{display:flex;align-items:center;gap:9px;}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent);}
.brand span{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);font-weight:600;}
.date-top{font-size:12px;color:var(--muted);text-align:right;line-height:1.3;}
/* Hero */
.hero{position:relative;border-radius:var(--radius);overflow:hidden;
  background:linear-gradient(160deg,var(--surface-2),var(--surface));
  border:1px solid var(--line);padding:24px 22px 26px;margin-bottom:14px;animation:rise .45s ease both;}
.hero .glow{position:absolute;top:-60px;right:-40px;width:180px;height:180px;border-radius:50%;
  background:var(--accent);filter:blur(70px);opacity:.16;pointer-events:none;}
.hero[data-type="rest"] .glow{background:var(--rest);opacity:.2;}
.hero[data-type="push"] .glow{background:var(--push);}
.hero[data-type="pull"] .glow{background:var(--pull);}
.hlabel{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--accent);font-weight:700;}
.hero[data-type="rest"] .hlabel{color:var(--rest);}
.hero[data-type="push"] .hlabel{color:var(--push);}
.hero[data-type="pull"] .hlabel{color:var(--pull);}
.hero .wday{font-size:13px;color:var(--muted);margin-top:6px;}
.hero .unit{font-family:'Anton',sans-serif;font-size:clamp(36px,11vw,58px);line-height:.95;
  text-transform:uppercase;margin-top:12px;word-break:break-word;}
.hero .badge{display:inline-flex;align-items:center;gap:6px;margin-top:16px;
  background:rgba(255,255,255,.05);border:1px solid var(--line);
  padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;color:var(--muted);}
.hero .badge b{color:var(--text);}
/* Session close button */
.close-btn{width:100%;border:none;border-radius:var(--radius);padding:16px;margin-bottom:14px;
  font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;
  justify-content:center;gap:8px;animation:rise .4s ease both;transition:.15s;}
.close-btn.open{background:var(--accent);color:#0c0c0e;}
.close-btn.done{background:var(--surface);color:var(--accent);border:1px solid var(--accent);}
.close-btn:active{transform:scale(.985);}
/* Exercise accordion */
.ex-section{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 16px;margin-bottom:14px;animation:rise .4s ease both;}
.ex-sec-title{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);
  font-weight:700;margin-bottom:12px;}
.ex-list{display:flex;flex-direction:column;gap:8px;}
.ex-card{background:var(--surface-2);border:1px solid var(--line);border-radius:13px;overflow:hidden;}
.ex-card.checked{opacity:.58;background:var(--surface);}
.ex-head{display:flex;align-items:center;gap:10px;padding:12px 13px;cursor:pointer;}
.ex-check{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line);background:transparent;
  color:transparent;font-size:13px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.ex-check.on{background:var(--accent);border-color:var(--accent);color:#0c0c0e;}
.ex-headtxt{flex:1;min-width:0;}
.ex-name{font-size:13.5px;font-weight:600;}
.ex-card.checked .ex-name{text-decoration:line-through;text-decoration-color:var(--muted);}
.ex-sub{font-size:11px;color:var(--accent);margin-top:2px;font-weight:600;}
.ex-chev{font-size:16px;color:var(--muted);}
.ex-body{padding:0 13px 12px;}
.ex-last{font-size:10.5px;color:var(--muted);margin:6px 0 2px;}
.ex-last b{color:var(--accent);font-weight:600;}
/* Sets */
.setrow-head{display:flex;gap:7px;align-items:center;margin-bottom:4px;}
.setrow-head .setnum{font-family:'Sora',sans-serif;font-size:9px;color:var(--muted);min-width:20px;text-align:center;font-weight:700;flex-shrink:0;}
.setrow-head .sh-kg,.setrow-head .sh-reps{flex:1;font-size:9px;color:var(--muted);text-align:center;font-weight:700;}
.setrow-head .sh-kg{flex:1.25;} .setrow-head .sh-x,.setrow-head .sh-sp{width:16px;flex-shrink:0;}
.setrow{display:flex;gap:7px;align-items:center;margin-bottom:6px;}
.setrow .setnum{font-family:'Anton',sans-serif;font-size:14px;color:var(--muted);min-width:20px;text-align:center;flex-shrink:0;}
.setrow .ef{flex:1;} .setrow .ef.kg{flex:1.25;}
.setrow .ef input{background:var(--bg);border:1px solid var(--line);color:var(--text);
  border-radius:9px;padding:9px 8px;font-family:inherit;font-size:15px;outline:none;width:100%;text-align:center;}
.setrow .ef input:focus{border-color:var(--accent);}
.setrow .ex-x{font-size:12px;color:var(--muted);flex-shrink:0;}
.setrow .setdel{background:transparent;border:none;color:var(--muted);font-size:14px;cursor:pointer;flex-shrink:0;width:22px;}
.setrow .setdel:active{color:var(--push);}
.setadd{width:100%;background:transparent;border:1px dashed var(--line);color:var(--accent);
  padding:9px;border-radius:10px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;margin-top:2px;}
/* Cardio */
.cardio-note{margin-top:10px;}
/* Plan tab */
.ptitle{font-family:'Anton',sans-serif;font-size:28px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:16px;}
.plantabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px;scrollbar-width:none;}
.plantabs::-webkit-scrollbar{display:none;}
.plantab{flex-shrink:0;background:var(--surface);border:1px solid var(--line);color:var(--muted);
  padding:8px 15px;border-radius:999px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;}
.plantab.active{background:var(--accent);color:#0c0c0e;border-color:var(--accent);}
.plantab.add{background:transparent;border:1px dashed var(--line);color:var(--accent);
  width:36px;padding:0;display:flex;align-items:center;justify-content:center;font-size:20px;}
.plan-status{font-size:12.5px;color:var(--muted);margin-bottom:14px;padding:10px 14px;
  background:var(--surface);border-radius:12px;border:1px solid var(--line);}
.plan-status b{color:var(--accent);}
/* Unit cards in Plan tab */
.punit{border-radius:14px;overflow:hidden;margin-bottom:8px;animation:rise .3s ease both;}
.punit-head{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:12px 14px;cursor:pointer;transition:.15s;}
.punit.open .punit-head{border-radius:14px 14px 0 0;border-bottom-color:transparent;}
.punit-head:active{background:var(--surface-2);}
.punit-head .pnum{font-family:'Anton',sans-serif;font-size:16px;color:var(--muted);min-width:24px;}
.punit-head.today .pnum{color:var(--accent);}
.tdot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.tdot-btn{width:18px;height:18px;border-radius:50%;flex-shrink:0;cursor:pointer;
  border:2px dashed rgba(255,255,255,.3);}
.tdot.pull,.tdot-btn.pull{background:var(--pull);}
.tdot.push,.tdot-btn.push{background:var(--push);}
.tdot.legs,.tdot-btn.legs{background:var(--legs);}
.tdot.rest,.tdot-btn.rest{background:var(--rest);}
.tdot.other,.tdot-btn.other{background:var(--muted);}
.punit-name{flex:1;font-size:14.5px;font-weight:500;}
.ptoday{font-size:9.5px;letter-spacing:1.5px;color:var(--accent);font-weight:700;flex-shrink:0;}
.pchev{font-size:16px;color:var(--muted);flex-shrink:0;}
.punit-body{background:var(--surface);border:1px solid var(--line);border-top:none;
  border-radius:0 0 14px 14px;padding:10px 14px 14px;}
.punit-edit-row{display:flex;gap:8px;align-items:center;margin-bottom:12px;}
.punit-edit-row input{flex:1;background:var(--surface-2);border:1px solid var(--line);color:var(--text);
  border-radius:10px;padding:10px 12px;font-family:inherit;font-size:14.5px;outline:none;}
.punit-edit-row input:focus{border-color:var(--accent);}
.punit-arrows{display:flex;gap:4px;}
.iconbtn{background:var(--surface-2);border:1px solid var(--line);color:var(--muted);width:32px;height:32px;
  border-radius:8px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.iconbtn:active{background:var(--line);}
.iconbtn.del{color:var(--push);}
.pex-row{display:flex;gap:7px;align-items:center;margin-bottom:7px;}
.pex-row input{flex:1;background:var(--bg);border:1px solid var(--line);color:var(--text);
  border-radius:9px;padding:9px 11px;font-family:inherit;font-size:13.5px;outline:none;}
.pex-row input:focus{border-color:var(--accent);}
.pex-shared{font-size:10.5px;color:var(--muted);margin:6px 2px 10px;font-style:italic;}
.pex-add{width:100%;background:transparent;border:1px dashed var(--line);color:var(--accent);
  padding:10px;border-radius:10px;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;}
.plan-addbtn{width:100%;background:transparent;border:1.5px dashed var(--line);color:var(--accent);
  padding:14px;border-radius:14px;font-family:inherit;font-weight:600;font-size:14px;cursor:pointer;margin-top:4px;}
/* Insert section in Plan tab */
.insert-sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;margin-top:20px;}
.insert-sec .sec-label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);
  font-weight:700;margin-bottom:12px;}
.irow{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.irow .idate{font-size:11.5px;color:var(--muted);min-width:80px;}
.irow .iname{flex:1;font-size:13.5px;font-weight:500;color:var(--push);}
.if-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.if-field{flex:1;min-width:110px;}
.if-field label{display:block;font-size:10.5px;color:var(--muted);margin-bottom:4px;}
.if-field input{width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--text);
  border-radius:10px;padding:10px 12px;font-family:inherit;font-size:13.5px;outline:none;}
.if-field input:focus{border-color:var(--push);}
.if-field input[type=date]{color-scheme:dark;}
.if-savebtn{background:var(--push);color:#fff;border:none;border-radius:10px;padding:11px 14px;
  font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;margin-top:12px;width:100%;}
/* Progress */
.subtabs{display:flex;gap:6px;margin-bottom:16px;}
.subtab{flex:1;background:var(--surface);border:1px solid var(--line);color:var(--muted);
  padding:9px;border-radius:12px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;}
.subtab.active{background:var(--accent);color:#0c0c0e;border-color:var(--accent);}
.summary{display:flex;gap:10px;margin-bottom:16px;}
.scard{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;}
.scard .v{font-family:'Anton',sans-serif;font-size:28px;line-height:1;color:var(--accent);}
.scard .k{font-size:11px;color:var(--muted);margin-top:4px;}
.hrow{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);
  border-radius:13px;padding:11px 14px;margin-bottom:7px;}
.hrow .hdate .d{font-family:'Anton',sans-serif;font-size:17px;line-height:1;}
.hrow .hdate .m{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
.hrow .hdate .wd{font-size:10px;color:var(--muted);}
.hrow .hunit{flex:1;font-size:13.5px;font-weight:500;}
.hcardio{font-size:11px;color:var(--muted);margin-top:2px;}
.htoday{font-size:9px;letter-spacing:1px;color:var(--accent);font-weight:700;}
.hcheck{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);color:transparent;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;}
.hrow.done .hcheck{background:var(--accent);border-color:var(--accent);color:#0c0c0e;}
.metrictabs{display:flex;gap:6px;margin-bottom:14px;}
.metrictab{flex:1;background:var(--surface);border:1px solid var(--line);color:var(--muted);
  padding:8px;border-radius:10px;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;}
.metrictab.active{background:var(--accent);color:#0c0c0e;border-color:var(--accent);}
.pu-head{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);
  border-radius:13px;padding:12px 14px;cursor:pointer;margin-bottom:6px;}
.pu-head.open{border-radius:13px 13px 0 0;margin-bottom:0;border-bottom-color:transparent;}
.pu-head .pu-name{font-family:'Anton',sans-serif;font-size:16px;text-transform:uppercase;flex:1;}
.pu-head .pu-chev{font-size:16px;color:var(--muted);}
.pu-body{background:var(--surface);border:1px solid var(--line);border-top:none;
  border-radius:0 0 13px 13px;padding:10px 10px 12px;margin-bottom:6px;}
.progcard{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:8px;}
.pc-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px;}
.pc-name{font-size:13.5px;font-weight:600;}
.pc-now{font-family:'Anton',sans-serif;font-size:18px;color:var(--accent);}
.pc-now small{font-family:'Sora',sans-serif;font-size:11px;color:var(--muted);font-weight:600;}
.pc-trend{font-size:11px;font-weight:600;margin-bottom:7px;}
.pc-trend.up{color:var(--accent);} .pc-trend.down{color:var(--push);} .pc-trend.flat{color:var(--muted);}
.pc-points{display:flex;flex-direction:column;gap:4px;margin-top:6px;}
.pp{display:flex;gap:8px;font-size:11px;}
.ppd{color:var(--muted);min-width:50px;} .ppk{font-weight:600;min-width:56px;}
.ppk.inc{color:var(--accent);} .ppk.dec{color:var(--push);} .ppn{color:var(--muted);flex:1;}
.prog-empty{text-align:center;color:var(--muted);font-size:13px;padding:30px 10px;line-height:1.7;}
/* Body */
.bigstat{background:linear-gradient(160deg,var(--surface-2),var(--surface));border:1px solid var(--line);
  border-radius:var(--radius);padding:22px;margin-bottom:14px;}
.bigstat .bk{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:700;}
.bigstat .bv{font-family:'Anton',sans-serif;font-size:52px;line-height:1;margin-top:6px;}
.bigstat .bv small{font-family:'Sora',sans-serif;font-size:16px;color:var(--muted);font-weight:600;margin-left:3px;}
.bigstat .bd{margin-top:8px;font-size:13px;font-weight:600;}
.bd.down{color:var(--accent);} .bd.up{color:var(--push);}
.chartcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 12px 8px;margin-bottom:14px;}
.rangetabs{display:flex;gap:6px;margin-bottom:6px;}
.rangetab{flex:1;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);
  padding:7px;border-radius:10px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;}
.rangetab.active{background:var(--accent);color:#0c0c0e;border-color:var(--accent);}
.chart .empty{text-align:center;color:var(--muted);font-size:12.5px;padding:36px 0;}
.inputcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
.inlabel{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:12px;}
.inrow{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;}
.infield{flex:1;min-width:90px;}
.infield label{display:block;font-size:10.5px;color:var(--muted);margin-bottom:4px;}
.infield input{width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--text);
  border-radius:10px;padding:11px 12px;font-family:inherit;font-size:15px;outline:none;}
.infield input:focus{border-color:var(--accent);}
.infield input[type=date]{color-scheme:dark;}
.savew{background:var(--accent);color:#0c0c0e;border:none;border-radius:10px;padding:11px 16px;
  font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;height:44px;}
.wlist .wlabel{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:700;margin:16px 2px 10px;}
.wentry{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:10px 13px;margin-bottom:6px;}
.wentry .wdt{font-size:12px;color:var(--muted);min-width:86px;}
.wentry .wkg{font-family:'Anton',sans-serif;font-size:17px;flex:1;}
.wentry .wkg small{font-family:'Sora',sans-serif;font-size:11px;color:var(--muted);font-weight:600;margin-left:2px;}
.wentry .wbf{font-size:11px;color:var(--muted);}
/* Nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;
  padding:7px 12px calc(7px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to top,var(--bg) 60%,transparent);}
.navinner{display:flex;gap:3px;background:var(--surface);border:1px solid var(--line);
  border-radius:18px;padding:5px;width:100%;max-width:420px;box-shadow:0 8px 28px rgba(0,0,0,.5);}
.navbtn{flex:1;background:transparent;border:none;color:var(--muted);cursor:pointer;
  border-radius:13px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-family:inherit;font-size:10px;font-weight:600;letter-spacing:.3px;}
.navbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.navbtn.active{background:var(--surface-2);color:var(--accent);}
/* Cardio */
.cardio-grid{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
.cfield{display:flex;flex-direction:column;gap:4px;}
.cfield label{font-size:9.5px;color:var(--muted);letter-spacing:.5px;}
.cfield input{background:var(--bg);border:1px solid var(--line);color:var(--text);
  border-radius:9px;padding:9px 10px;font-family:inherit;font-size:15px;outline:none;width:100%;}
.cfield input:focus{border-color:var(--accent);}
.pulse-row{display:flex;gap:8px;margin-top:4px;}
.pulse-row .cfield label{color:var(--pull);}
/* Misc */
.psub{font-size:12.5px;color:var(--muted);margin-bottom:16px;line-height:1.5;}
.foot{margin-top:24px;text-align:center;font-size:11px;color:var(--muted);line-height:1.6;}
.inp{background:var(--surface-2);border:1px solid var(--line);color:var(--text);border-radius:10px;
  padding:10px 12px;font-family:inherit;font-size:14.5px;outline:none;width:100%;}
.inp:focus{border-color:var(--accent);}
/* Onboarding */
.ob-wrap{display:flex;flex-direction:column;align-items:center;text-align:center;padding:40px 8px 20px;}
.ob-logo{margin-bottom:20px;}
.ob-title{font-family:'Anton',sans-serif;font-size:52px;letter-spacing:1px;color:var(--text);margin-bottom:12px;}
.ob-sub{font-size:14px;color:var(--muted);line-height:1.6;white-space:pre-line;margin-bottom:28px;}
.ob-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;width:100%;margin-bottom:20px;text-align:left;}
.ob-label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:700;}
.ob-hint{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5;}
.ob-btn{background:var(--accent);color:#0c0c0e;border:none;border-radius:14px;padding:17px 20px;
  font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;width:100%;margin-bottom:16px;}
.ob-btn:active{transform:scale(.98);}
.ob-footer{font-size:11px;color:var(--muted);}
@keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.loading{text-align:center;padding:60px 0;color:var(--muted);}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading">l\u00e4dt \u2026</div></div>
<nav class="nav" id="nav"></nav>
<script>
const STORE_KEY='tz_newdesign1';
const WD=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const WDS=['So','Mo','Di','Mi','Do','Fr','Sa'];
const MON=['Jan','Feb','M\u00e4rz','Apr','Mai','Juni','Juli','Aug','Sep','Okt','Nov','Dez'];
const CARDIO_UNITS=[{key:'lauf1',name:'Laufband 1',icon:'\ud83c\udfc3'},{key:'bike',name:'Fahrrad',icon:'\ud83d\udeb4'},{key:'lauf2',name:'Laufband 2',icon:'\ud83c\udfc3'}];
const TYPE_ORDER=['pull','push','legs','rest','other'];

function makeId(){return Math.random().toString(36).slice(2,8);}
function pad2(n){return String(n).padStart(2,'0');}
function isoOf(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function todayISO(){const d=new Date();d.setHours(0,0,0,0);return isoOf(d);}
function isoToDate(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function diffDays(a,b){return Math.round((isoToDate(a)-isoToDate(b))/86400000);}
function fmt(n){return (Math.round(n*10)/10).toLocaleString('de-DE');}
function esc(s){return(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function escA(s){return(s||'').replace(/["&<>]/g,c=>({'"':'&quot;','&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function sho(s,n){n=n||18;s=s||'';return s.length>n?s.slice(0,n-1)+'\u2026':s;}

function typeOf(n){
  const v=(n||'').toLowerCase();
  if(/rest|pause|frei|ruhe|erholung/.test(v)) return 'rest';
  if(/r.cken|bizeps|pull|latz/.test(v)) return 'pull';
  if(/brust|schulter|trizeps|push|press/.test(v)) return 'push';
  if(/bein|nacken|leg|glute|wade|squat/.test(v)) return 'legs';
  return 'other';
}
function defaultPlan(){
  return {id:makeId(),name:'Push \u00b7 Pull \u00b7 Legs',
    cycle:['R\u00fccken \u00b7 Bizeps','Brust \u00b7 Schulter \u00b7 Trizeps','Active Rest','Beine \u00b7 Nacken','R\u00fccken \u00b7 Bizeps','Active Rest','Brust \u00b7 Schulter \u00b7 Trizeps','Beine \u00b7 Nacken','Active Rest'],
    cycleTypes:new Array(9).fill(null),anchorISO:todayISO(),anchorDay:1,dayNotes:{},exercises:{}};
}
function defaultState(){
  const p={id:makeId(),name:'',cycle:[],cycleTypes:[],anchorISO:todayISO(),anchorDay:1,dayNotes:{},exercises:{}};
  return {plans:[p],activePlanId:p.id,log:{},weight:[],inserts:{},setupDone:false};
}

let state=null, view='today', histSub='activity', progMetric='top', weightRange='1M', weightDate=null;
let openPlanIdx=-1, openProgUnits=null, openExSet={}, openCardioSet={};

function activePlan(){return state.plans.find(p=>p.id===state.activePlanId)||state.plans[0];}
function getType(i){const p=activePlan();return(p.cycleTypes&&p.cycleTypes[i])||typeOf(p.cycle[i]);}

function calcIndexUpTo(untilISO){
  const p=activePlan(),len=p.cycle.length;
  if(!len) return 0;
  const ins=state.inserts||{};
  let pos=p.anchorDay-1;
  const anchor=isoToDate(p.anchorISO),until=isoToDate(untilISO);
  for(let d=new Date(anchor);d<until;d.setDate(d.getDate()+1)){
    const iso=isoOf(d);
    if(ins[iso]) continue;
    const t=(p.cycleTypes&&p.cycleTypes[pos%len])||typeOf(p.cycle[pos%len]);
    if(t==='rest'){pos++;}
    else{const e=state.log&&state.log[iso];if(e&&e.done) pos++;}
  }
  return((pos%len)+len)%len;
}
function currentIndex(){return calcIndexUpTo(todayISO());}
function indexForISO(iso){return calcIndexUpTo(iso);}

/* Storage */
const mem={};
async function sGet(k){try{const v=localStorage.getItem(k);if(v!=null)return v;}catch(e){}return mem[k]||null;}
async function sSet(k,v){try{localStorage.setItem(k,v);}catch(e){}mem[k]=v;}

async function load(){
  try{const v=await sGet(STORE_KEY);if(v){state=JSON.parse(v);}}catch(e){}
  // Frischer Start - keine Migration
  if(!state) state=defaultState();
  if(!state.inserts) state.inserts={};
  if(!state.log) state.log={};
  if(!Array.isArray(state.weight)) state.weight=[];
  state.plans.forEach(p=>{if(!p.dayNotes)p.dayNotes={};if(!p.exercises)p.exercises={};});
  if(state.setupDone===undefined) state.setupDone=state.plans[0].cycle.length>0;
}
async function save(){try{await sSet(STORE_KEY,JSON.stringify(state));}catch(e){}}

/* Exercise helpers */
function normSets(e){
  if(!e)return{rows:[]};
  if(Array.isArray(e.rows))return{rows:e.rows};
  if(e.kg!=null){const n=e.sets||1,rows=[];for(let i=0;i<n;i++)rows.push({kg:e.kg,reps:e.reps||null});return{rows};}
  return{rows:[]};
}
function getExEntry(iso,unit,exId){
  const e=state.log[iso];
  const raw=e&&e.sets&&e.sets[unit]&&e.sets[unit][exId];
  const n=normSets(raw);
  if(!n.rows.length)n.rows=[{kg:null,reps:null}];
  n.checked=!!(raw&&raw.checked);
  return n;
}
function ensureExEntry(unit,exId){
  const iso=todayISO();
  if(!state.log[iso])state.log[iso]={};
  const e=state.log[iso];
  if(!e.sets)e.sets={};
  if(!e.sets[unit])e.sets[unit]={};
  if(!e.sets[unit][exId]||!Array.isArray(e.sets[unit][exId].rows))
    e.sets[unit][exId]=normSets(e.sets[unit][exId]);
  return e.sets[unit][exId];
}
function saveSetRow(unit,exId,ri,field,val){
  const e=ensureExEntry(unit,exId);
  while(e.rows.length<=ri)e.rows.push({kg:null,reps:null});
  const n=val===''?null:parseFloat(val.replace(',','.'));
  e.rows[ri][field]=(n!=null&&!isNaN(n))?n:null;
  save();
}
function addSetRow(unit,exId){
  const e=ensureExEntry(unit,exId);
  const last=e.rows.length?e.rows[e.rows.length-1]:{kg:null,reps:null};
  e.rows.push({kg:last.kg,reps:last.reps});
  save();render();
}
function delSetRow(unit,exId,ri){
  const e=ensureExEntry(unit,exId);
  if(e.rows.length<=1)return;
  e.rows.splice(ri,1);
  save();render();
}
function lastSessionFor(unit,exId){
  const today=todayISO();
  const dates=Object.keys(state.log).filter(d=>d<today).sort().reverse();
  for(const d of dates){
    const s=state.log[d]&&state.log[d].sets&&state.log[d].sets[unit];
    if(s&&s[exId]){const e=normSets(s[exId]);if(e.rows.some(r=>r.kg!=null))return{date:d,rows:e.rows};}
  }
  return null;
}
function sessionUsesChecks(unitSets){return Object.values(unitSets||{}).some(s=>s&&s.checked===true);}
function exCountsOnDay(unitSets,exId){
  const s=unitSets&&unitSets[exId];
  if(!s)return false;
  if(!normSets(s).rows.some(r=>r.kg!=null))return false;
  if(sessionUsesChecks(unitSets))return s.checked===true;
  return true;
}
function avgKg(e){const v=e.rows.map(r=>r.kg).filter(v=>v!=null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;}
function exSummary(unit,exId){
  const e=getExEntry(todayISO(),unit,exId);
  const kgs=e.rows.map(r=>r.kg).filter(v=>v!=null&&!isNaN(v));
  if(!kgs.length)return 'keine Werte';
  const n=e.rows.length,min=Math.min(...kgs),max=Math.max(...kgs);
  return `${n} ${n>1?'S\u00e4tze':'Satz'} \u00b7 ${min===max?fmt(min):fmt(min)+'\u2013'+fmt(max)} kg`;
}
function getExercises(i){const p=activePlan();if(!p.exercises)p.exercises={};return p.exercises[p.cycle[i]]||[];}
function setExercises(i,arr){const p=activePlan();p.exercises[p.cycle[i]]=arr;save();}

function prefillToday(){
  const iso=todayISO(),p=activePlan(),idx=currentIndex();
  if(getType(idx)==='rest')return;
  const unit=p.cycle[idx];
  const ex=getExercises(idx);
  if(!ex.length)return;
  if(!state.log[iso])state.log[iso]={};
  const e=state.log[iso];
  if(!e.sets)e.sets={};
  if(!e.sets[unit])e.sets[unit]={};
  ex.forEach(x=>{
    const already=e.sets[unit][x.id];
    const hasData=already&&Array.isArray(already.rows)&&already.rows.some(r=>r.kg!=null);
    if(!hasData){
      const last=lastSessionFor(unit,x.id);
      if(last&&last.rows.length)e.sets[unit][x.id]={rows:last.rows.map(r=>({kg:r.kg,reps:r.reps}))};
    }
  });
  save();
}

function isExOpen(unit,exId){const k=unit+'|'+exId;return k in openExSet?openExSet[k]:!getExEntry(todayISO(),unit,exId).checked;}
function toggleExCheck(unit,exId){const e=ensureExEntry(unit,exId);e.checked=!e.checked;openExSet[unit+'|'+exId]=e.checked?false:true;save();render();}
function toggleExOpen(unit,exId){if(getExEntry(todayISO(),unit,exId).checked)return;const k=unit+'|'+exId;openExSet[k]=!isExOpen(unit,exId);render();}
function isCardioOpen(key,checked){return key in openCardioSet?openCardioSet[key]:!checked;}
function toggleCardioOpen(key){const e=(state.log[todayISO()]||{});const c=!!(e.cardio&&e.cardio[key]&&e.cardio[key].done);if(c)return;openCardioSet[key]=!isCardioOpen(key,c);render();}
function toggleCardioUnit(key){const iso=todayISO();if(!state.log[iso])state.log[iso]={};const e=state.log[iso];if(!e.cardio)e.cardio={};if(!e.cardio[key])e.cardio[key]={};e.cardio[key].done=!e.cardio[key].done;openCardioSet[key]=e.cardio[key].done?false:true;save();render();}
function saveCardio(key,field,val){const iso=todayISO();if(!state.log[iso])state.log[iso]={};const e=state.log[iso];if(!e.cardio)e.cardio={};if(!e.cardio[key])e.cardio[key]={};const n=val===''?null:parseInt(val,10);e.cardio[key][field]=(n!=null&&!isNaN(n))?n:null;save();}
function updateCardioNote(v){const e=state.log[todayISO()]||(state.log[todayISO()]={});e.cardioNote=v;save();}
function updateSessionNote(v){const e=state.log[todayISO()]||(state.log[todayISO()]={});e.sessionNote=v;save();}

function renderOnboarding(){
  return `<div class="ob-wrap">
    <div class="ob-logo"><div class="dot" style="width:16px;height:16px;background:var(--accent);border-radius:50%;box-shadow:0 0 20px var(--accent);"></div></div>
    <div class="ob-title">Training</div>
    <div class="ob-sub">Dein persönlicher Trainingstracker.
Bitte richte deinen ersten Plan ein.</div>
    <div class="ob-card">
      <div class="ob-label">Wie heißt dein Plan?</div>
      <input id="ob-name" class="inp" placeholder="z.B. Push · Pull · Legs" style="margin-top:8px;" oninput="" autofocus>
      <div class="ob-hint">Du kannst den Namen später jederzeit ändern und weitere Pläne hinzufügen.</div>
    </div>
    <button class="ob-btn" onclick="finishSetup()">Plan erstellen &amp; Einheiten einrichten →</button>
    <div class="ob-footer">Deine Daten bleiben lokal auf deinem Gerät.</div>
  </div>`;
}
function finishSetup(){
  const name=(document.getElementById('ob-name').value||'').trim()||'Mein Plan';
  state.plans[0].name=name;
  state.setupDone=true;
  view='plan'; openPlanIdx=-1;
  save(); render();
}

/* ====== RENDER ====== */
function render(){
  const app=document.getElementById('app');
  if(!state.setupDone){app.innerHTML=renderOnboarding();renderNav();return;}
  if(view==='today')app.innerHTML=renderToday();
  else if(view==='plan')app.innerHTML=renderPlan();
  else if(view==='progress')app.innerHTML=renderProgress();
  else app.innerHTML=renderBody();
  renderNav();
  app.querySelectorAll('textarea').forEach(t=>{t.style.height='auto';t.style.height=t.scrollHeight+'px';});
}

function hdr(){const n=new Date();return `<div class="top"><div class="brand"><div class="dot"></div><span>Training</span></div><div class="date-top">${n.getDate()}. ${MON[n.getMonth()]}<br>${n.getFullYear()}</div></div>`;}

/* ====== TODAY ====== */
function renderToday(){
  const p=activePlan(),idx=currentIndex(),iso=todayISO();
  if(!p.cycle.length) return `${hdr()}<div style="text-align:center;padding:40px 16px;color:var(--muted);line-height:1.7;">Noch keine Einheiten im Plan.<br><button onclick="setView('plan')" style="margin-top:16px;background:var(--accent);color:#0c0c0e;border:none;border-radius:12px;padding:13px 20px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;">\u2192 Plan einrichten</button></div>`;
  const insert=(state.inserts||{})[iso];
  const unit=p.cycle[idx]||'',tType=insert?'other':getType(idx);
  const isRest=tType==='rest';
  const e=state.log[iso]||{};
  const isDone=!!e.done;
  const now=new Date();
  const dateStr=WD[now.getDay()]+', '+now.getDate()+'. '+MON[now.getMonth()];
  const heroUnit=insert?insert.label:unit;
  const heroType=insert?'other':tType;

  let sessionHtml='';
  if(insert){
    sessionHtml=`<button class="close-btn ${isDone?'done':'open'}" onclick="toggleDone()">
      <span>${isDone?'\u2713':'\u25cb'}</span>${isDone?'Erledigt':'Als erledigt markieren'}
    </button>`;
  } else if(isRest){
    sessionHtml=cardioHtml(e)+`<button class="close-btn ${isDone?'done':'open'}" onclick="toggleDone()" style="margin-top:14px">
      <span>${isDone?'\u2713':'\u25cb'}</span>${isDone?'Session abgeschlossen':'Session abschlie\u00dfen'}
    </button>`;
  } else {
    const ex=getExercises(idx);
    if(ex.length){
      const cards=ex.map(x=>{
        const entry=getExEntry(iso,unit,x.id);
        const checked=entry.checked,open=isExOpen(unit,x.id);
        const last=lastSessionFor(unit,x.id);
        let lastHtml='';
        if(last){const d=isoToDate(last.date);const s=last.rows.filter(r=>r.kg!=null).map(r=>`${fmt(r.kg)}\u00d7${r.reps!=null?r.reps:'?'}`).join(', ');lastHtml=`<div class="ex-last">Zuletzt (${d.getDate()}.${d.getMonth()+1}.): <b>${esc(s)}</b></div>`;}
        const setRows=entry.rows.map((r,ri)=>`<div class="setrow">
          <span class="setnum">${ri+1}</span>
          <div class="ef kg"><input type="number" inputmode="decimal" step="0.5" placeholder="kg" value="${r.kg!=null?r.kg:''}" oninput="saveSetRow('${escA(unit)}','${x.id}',${ri},'kg',this.value)"></div>
          <span class="ex-x">\u00d7</span>
          <div class="ef"><input type="number" inputmode="numeric" placeholder="Wdh" value="${r.reps!=null?r.reps:''}" oninput="saveSetRow('${escA(unit)}','${x.id}',${ri},'reps',this.value)"></div>
          <button class="setdel" onclick="delSetRow('${escA(unit)}','${x.id}',${ri})">\u2715</button>
        </div>`).join('');
        return `<div class="ex-card${checked?' checked':''}">
          <div class="ex-head" onclick="toggleExOpen('${escA(unit)}','${x.id}')">
            <button class="ex-check${checked?' on':''}" onclick="event.stopPropagation();toggleExCheck('${escA(unit)}','${x.id}')">\u2713</button>
            <div class="ex-headtxt"><div class="ex-name">${esc(x.name||'(unbenannt)')}</div>${checked?`<div class="ex-sub">${esc(exSummary(unit,x.id))}</div>`:''}</div>
            ${!checked?`<span class="ex-chev">${open?'\u2303':'\u2304'}</span>`:''}
          </div>
          ${open&&!checked?`<div class="ex-body">
            <div class="setrow-head"><span class="setnum">#</span><span class="sh-kg">GEWICHT</span><span class="sh-x"></span><span class="sh-reps">WDH</span><span class="sh-sp"></span></div>
            <div>${setRows}</div>
            <button class="setadd" onclick="addSetRow('${escA(unit)}','${x.id}')">+ Satz hinzuf\u00fcgen</button>
            ${lastHtml}
          </div>`:''}
        </div>`;
      }).join('');
      sessionHtml=`<div class="ex-section"><div class="ex-sec-title">\ud83c\udfcb\ufe0f Session \u00b7 ${esc(sho(unit,22))}</div><div class="ex-list">${cards}</div>
        <div class="cardio-note" style="margin-top:12px;"><textarea class="inp" style="min-height:44px;font-size:13.5px;resize:none;overflow:hidden;margin-top:0;" placeholder="Session-Notiz (optional)..." oninput="updateSessionNote(this.value);this.style.height='auto';this.style.height=this.scrollHeight+'px'">${esc(e.sessionNote||'')}</textarea></div>
      </div>`;
    } else {
      sessionHtml=`<div class="ex-section"><div class="ex-sec-title">\ud83c\udfcb\ufe0f Session \u00b7 ${esc(sho(unit,22))}</div>
        <p style="font-size:13px;color:var(--muted);padding:4px 2px 8px;line-height:1.5;">Noch keine \u00dcbungen f\u00fcr diese Einheit. Tippe auf <b>Plan</b> unten, dann auf diesen Tag, um \u00dcbungen hinzuzuf\u00fcgen.</p>
      </div>`;
    }
    sessionHtml+=`<button class="close-btn ${isDone?'done':'open'}" onclick="toggleDone()">
      <span>${isDone?'\u2713':'\u25cb'}</span>${isDone?'Session abgeschlossen \u2013 \u00f6ffnen?':'Session abschlie\u00dfen'}
    </button>`;
  }

  return `${hdr()}
    <div class="hero" data-type="${heroType}">
      <div class="glow"></div>
      <div class="hlabel">${insert?'Sonder-Einheit heute':'Heute trainierst du'}</div>
      <div class="wday">${dateStr}</div>
      <div class="unit">${esc(heroUnit)}</div>
      <div class="badge">Tag <b>${idx+1}</b> von <b>${p.cycle.length}</b> im Zyklus${insert?` \u00b7 Zyklus wartet`:''}</div>
    </div>
    ${sessionHtml}
    <div class="foot">Daten werden automatisch gespeichert</div>`;
}

function cardioHtml(entry){
  const cd=entry.cardio||{};
  const units=CARDIO_UNITS.map(u=>{
    const d=cd[u.key]||{},checked=!!d.done,open=isCardioOpen(u.key,checked);
    return `<div class="ex-card${checked?' checked':''}">
      <div class="ex-head" onclick="toggleCardioOpen('${u.key}')">
        <button class="ex-check${checked?' on':''}" onclick="event.stopPropagation();toggleCardioUnit('${u.key}')">\u2713</button>
        <div class="ex-headtxt"><div class="ex-name">${u.icon} ${u.name}</div>${checked?`<div class="ex-sub">${d.min!=null?d.min+' min':''}${d.avgPulse?' \u00b7 \u00d8 '+d.avgPulse+' bpm':''}</div>`:''}</div>
        ${!checked?`<span class="ex-chev">${open?'\u2303':'\u2304'}</span>`:''}
      </div>
      ${open&&!checked?`<div class="ex-body">
        <div class="cfield"><label>DAUER (min)</label><input type="number" inputmode="numeric" placeholder="15" value="${d.min!=null?d.min:''}" oninput="saveCardio('${u.key}','min',this.value)"></div>
        <div class="pulse-row">
          <div class="cfield"><label>\u2665 \u00d8-PULS</label><input type="number" inputmode="numeric" placeholder="\u2013" value="${d.avgPulse!=null?d.avgPulse:''}" oninput="saveCardio('${u.key}','avgPulse',this.value)"></div>
          <div class="cfield"><label>\u2665 MAX-PULS</label><input type="number" inputmode="numeric" placeholder="\u2013" value="${d.maxPulse!=null?d.maxPulse:''}" oninput="saveCardio('${u.key}','maxPulse',this.value)"></div>
        </div>
      </div>`:''}
    </div>`;
  }).join('');
  return `<div class="ex-section"><div class="ex-sec-title">\ud83d\udeb4 Cardio-Log</div><div class="ex-list">${units}</div>
    <div class="cardio-note" style="margin-top:10px;"><textarea class="inp" style="min-height:44px;font-size:13.5px;resize:none;overflow:hidden;margin-top:0;" placeholder="Notiz (optional)..." oninput="updateCardioNote(this.value);this.style.height='auto';this.style.height=this.scrollHeight+'px'">${esc(entry.cardioNote||'')}</textarea></div>
  </div>`;
}

/* ====== PLAN TAB ====== */
function renderPlan(){
  const p=activePlan(),idx=currentIndex(),iso=todayISO();
  const tabs=state.plans.map(pl=>`<button class="plantab${pl.id===state.activePlanId?' active':''}" onclick="switchPlan('${pl.id}')">${esc(sho(pl.name,15))}</button>`).join('');
  const insert=(state.inserts||{})[iso];
  const statusTxt=insert?`Heute: <b>${esc(insert.label)}</b> \u2014 Zyklus wartet`:(p.cycle.length?`Heute: Tag <b>${idx+1}</b> \u00b7 <b>${esc(sho(p.cycle[idx]||'',24))}</b>`:`Noch keine Einheiten \u2014 f\u00fcge unten welche hinzu`);

  const days=p.cycle.map((u,i)=>{
    const t=(p.cycleTypes&&p.cycleTypes[i])||typeOf(u);
    const isToday=i===idx&&!insert;
    const isOpen=openPlanIdx===i;
    const ex=getExercises(i);
    // Find if another day with same name comes first
    const firstIdx=p.cycle.indexOf(u);
    const isShared=firstIdx!==i;
    const sharedEx=isShared?`<div class="pex-shared">\u21aa Teilt \u00dcbungen mit Tag ${firstIdx+1} (${esc(sho(u,18))})</div>`:'';

    let bodyHtml='';
    if(isOpen){
      const exRows=ex.map(x=>`<div class="pex-row">

      bodyHtml=`<div class="punit-body">

          <button class="tdot-btn ${t}" onclick="cycleType(${i})" title="Farbe \u00e4ndern"></button>
          <input class="inp" style="flex:1;font-size:14.5px;font-weight:500;" value="${escA(u)}" oninput="editUnit(${i},this.value)" placeholder="Einheit benennen">
          <div class="punit-arrows">
            <button class="iconbtn" onclick="moveUnit(${i},-1)">\u25b2</button>

  // Upcoming inserts

  const upcoming=Object.keys(ins).filter(d=>d>=iso).sort().slice(0,7);
  const insRows=upcoming.map(d=>{const dd=isoToDate(d);return `<div class="irow"><div class="idate">${WDS[dd.getDay()]}, ${dd.getDate()}. ${MON[dd.getMonth()]}</div><div class="iname">${esc(ins[d].label)}</div><button class="iconbtn del" onclick="removeInsert('${d}')">\u2715</button></div>`;}).join('');

  return `${hdr()}
    <div class="ptitle">Plan</div>

      <div class="sec-label">\ud83d\udcc5 Sonder-Einheiten</div>

      </div>
      <button class="if-savebtn" onclick="addInsert()">Eintragen \u2192 Zyklus passt sich an</button>
    </div>
    <div style="margin-top:28px;display:flex;flex-direction:column;gap:8px;">

      <button onclick="resetApp()" style="width:100%;background:transparent;border:1px dashed var(--line);color:var(--muted);border-radius:12px;padding:12px;font-family:inherit;font-size:12px;cursor:pointer;">⚠️ Alle Daten zurücksetzen (Neustart)</button>

function renderProgress(){

    <button class="subtab${histSub==='progress'?' active':''}" onclick="setHistSub('progress')">Fortschritt</button>

function unitForISO(iso){
  const p=activePlan(),len=p.cycle.length;
  if(!len)return{unit:'\u2014',type:'other'};
  const idx=indexForISO(iso);
  return{unit:p.cycle[idx],type:getType(idx)};
}

function activityHtml(){
  const N=42,now=new Date();now.setHours(0,0,0,0);
  const todayIso=todayISO();
  let done=0,rows='';
  for(let k=0;k<N;k++){
    const d=new Date(now);d.setDate(d.getDate()-k);
    const iso=isoOf(d);
    const insert=(state.inserts||{})[iso];
    const info=unitForISO(iso);
    const dispName=insert?insert.label:info.unit;
    const dispType=insert?'other':info.type;
    const e=state.log[iso]||{};
    const isDone=!!e.done;if(isDone)done++;
    const isToday=iso===todayIso;
    let sum='';
    if(isDone){
      if(insert){}
      else if(dispType==='rest'&&e.cardio){
        const parts=CARDIO_UNITS.filter(u=>e.cardio[u.key]&&e.cardio[u.key].done).map(u=>{const x=e.cardio[u.key];let s=u.name;if(x.min)s+=` ${x.min}min`;if(x.avgPulse)s+=` \u00d8${x.avgPulse}`;return s;});
        if(parts.length)sum=`<div class="hcardio">${esc(parts.join(' \u00b7 '))}</div>`;
      } else {
        const sets=e.sets&&e.sets[info.unit];
        if(sets){const n=Object.keys(sets).filter(id=>exCountsOnDay(sets,id)).length;if(n)sum=`<div class="hcardio">${n} \u00dcbung${n>1?'en':''} erfasst${e.sessionNote?' \u00b7 '+esc(sho(e.sessionNote.replace(/\\n/g,' '),34)):''}</div>`;}
        if(!sum&&e.sessionNote)sum=`<div class="hcardio">${esc(sho(e.sessionNote.replace(/\\n/g,' '),60))}</div>`;
      }
    }
    rows+=`<div class="hrow${isDone?' done':''}">
      <div class="hdate"><div class="d">${d.getDate()}</div><div class="m">${MON[d.getMonth()]}</div><div class="wd">${WDS[d.getDay()]}</div></div>
      <div class="tdot ${dispType}"></div>
      <div class="hunit">${esc(dispName)}${isToday?' &nbsp;<span class="htoday">HEUTE</span>':''}${insert?` <span style="font-size:9.5px;color:var(--push);font-weight:700;">EINSCHUB</span>`:''}${sum}</div>
      <div class="hcheck">\u2713</div>
    </div>`;
  }
  return `<div class="psub">Deine letzten ${N} Tage.</div>
    <div class="summary">
      <div class="scard"><div class="v">${done}</div><div class="k">erledigt (${N} Tage)</div></div>
      <div class="scard"><div class="v">${Math.round(done/N*7*10)/10}</div><div class="k">\u00d8 pro Woche</div></div>
    </div>${rows}`;
}

function progressHtml(){
  const p=activePlan();
  const seen=new Set(),units=[];
  p.cycle.forEach((u,i)=>{if(typeOf(u)==='rest'||getType(i)==='rest')return;if(seen.has(u))return;seen.add(u);units.push({name:u,idx:i,type:getType(i)});});

  function mKg(rows){const v=rows.map(r=>r.kg).filter(v=>v!=null&&!isNaN(v));if(!v.length)return null;return progMetric==='avg'?v.reduce((a,b)=>a+b,0)/v.length:Math.max(...v);}
  function seriesFor(unit,exId){
    const out=[];
    Object.keys(state.log).sort().forEach(d=>{
      const s=state.log[d]&&state.log[d].sets&&state.log[d].sets[unit];
      if(s&&s[exId]&&exCountsOnDay(s,exId)){const n=normSets(s[exId]);const kg=mKg(n.rows);if(kg!=null)out.push({date:d,kg,rows:n.rows,note:state.log[d].sessionNote||''});}
    });
    return out;
  }

  const todayIso=todayISO();
  const todayInsert=(state.inserts||{})[todayIso];
  const curIdx=currentIndex();
  const curType=getType(curIdx);
  const curUnit=activePlan().cycle[curIdx];
  const autoOpen=(!todayInsert&&curType!=='rest')?curUnit:null;
  if(openProgUnits===null){openProgUnits={};if(autoOpen)openProgUnits[autoOpen]=true;}

  let anyData=false;
  const blocks=units.map(u=>{
    const ex=(p.exercises&&p.exercises[u.name])||[];if(!ex.length)return'';
    const cards=ex.map(e=>{
      const series=seriesFor(u.name,e.id);if(!series.length)return'';anyData=true;
      const lat=series[series.length-1],fst=series[0];
      const diff=Math.round((lat.kg-fst.kg)*10)/10;
      let tc='flat',tt='gleich geblieben';
      if(series.length>1&&diff>0){tc='up';tt=`+${fmt(diff)} kg seit Start \ud83d\udcc8`;}
      else if(series.length>1&&diff<0){tc='down';tt=`${fmt(diff)} kg seit Start`;}
      else if(series.length===1){tc='flat';tt='erster Eintrag';}
      const pts=series.slice(-8).reverse();
      const pp=pts.map((s,k)=>{
        const ri=series.length-1-k,prev=ri>0?series[ri-1]:null;
        let kc='';if(prev){if(s.kg>prev.kg)kc='inc';else if(s.kg<prev.kg)kc='dec';}
        const d=isoToDate(s.date);
        const st=s.rows.filter(r=>r.kg!=null).map(r=>`${fmt(r.kg)}\u00d7${r.reps!=null?r.reps:'?'}`).join(', ');
        return `<div class="pp"><span class="ppd">${d.getDate()}.${d.getMonth()+1}.${String(d.getFullYear()).slice(2)}</span><span class="ppk ${kc}">${fmt(s.kg)} kg${kc==='inc'?' \u2191':kc==='dec'?' \u2193':''}</span><span class="ppn">${esc(sho(st,22))}${s.note?' \u00b7 '+esc(sho(s.note.replace(/\\n/g,' '),20)):''}</span></div>`;
      }).join('');
      const chart=buildChart(series);
      return `<div class="progcard"><div class="pc-head"><div class="pc-name">${esc(e.name||'(unbenannt)')}</div><div class="pc-now">${fmt(lat.kg)}<small> kg</small></div></div><div class="pc-trend ${tc}">${tt}</div>${chart}<div class="pc-points">${pp}</div></div>`;
    }).filter(Boolean).join('');
    if(!cards)return'';
    const isOpen=!!openProgUnits[u.name];
    return `<div class="prog-unit">
      <div class="pu-head${isOpen?' open':''}" onclick="toggleProgUnit('${escA(u.name)}')">
        <span class="tdot ${u.type}"></span><span class="pu-name">${esc(u.name)}</span>
        <span class="pu-chev">${isOpen?'\u2303':'\u2304'}</span>
      </div>
      ${isOpen?`<div class="pu-body">${cards}</div>`:''}
    </div>`;
  }).filter(Boolean).join('');

  if(!anyData)return `<div class="prog-empty">Noch keine Trainingsdaten.<br><br>Schlie\u00dfe auf der <b>Heute</b>-Seite eine Session ab und trage Gewichte ein. Sobald du dieselbe Einheit mehrmals trainiert hast, siehst du hier deine Entwicklung.</div>`;
  return `<div class="psub">Gewichtsentwicklung pro \u00dcbung.</div>
    <div class="metrictabs"><button class="metrictab${progMetric==='top'?' active':''}" onclick="setProgMetric('top')">Top-Satz</button><button class="metrictab${progMetric==='avg'?' active':''}" onclick="setProgMetric('avg')">\u00d8 Schnitt</button></div>${blocks}`;
}

function buildChart(series){
  if(series.length<2)return'';
  const W=300,H=80,pL=6,pR=6,pT=8,pB=8;
  const xs=series.map(s=>isoToDate(s.date).getTime()),ys=series.map(s=>s.kg);
  let mnX=Math.min(...xs),mxX=Math.max(...xs),mnY=Math.min(...ys),mxY=Math.max(...ys);
  if(mnY===mxY){mnY-=1;mxY+=1;}const ry=mxY-mnY;mnY-=ry*.2;mxY+=ry*.2;
  if(mnX===mxX){mnX-=1;mxX+=1;}
  const sx=x=>pL+(x-mnX)/(mxX-mnX)*(W-pL-pR);
  const sy=y=>pT+(1-(y-mnY)/(mxY-mnY))*(H-pT-pB);
  const line=series.map((s,i)=>(i?'L':'M')+sx(isoToDate(s.date).getTime()).toFixed(1)+' '+sy(s.kg).toFixed(1)).join(' ');
  const area='M'+sx(mnX).toFixed(1)+' '+(H-pB).toFixed(1)+' '+series.map(s=>'L'+sx(isoToDate(s.date).getTime()).toFixed(1)+' '+sy(s.kg).toFixed(1)).join(' ')+' L'+sx(mxX).toFixed(1)+' '+(H-pB).toFixed(1)+' Z';
  const dots=series.map(s=>`<circle cx="${sx(isoToDate(s.date).getTime()).toFixed(1)}" cy="${sy(s.kg).toFixed(1)}" r="2.3" fill="var(--accent)"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;margin:3px 0;"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--accent)" stop-opacity=".22"/><stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#g)"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}</svg>`;
}

function renderBody(){
  const w=state.weight.slice().sort((a,b)=>a.date.localeCompare(b.date));

  let diffHtml='';

  const cut=rangeCutoff();
  const pts=w.filter(e=>isoToDate(e.date).getTime()>=cut).map(e=>({x:isoToDate(e.date).getTime(),y:e.kg,date:e.date}));
  const wd=weightDate||todayISO(),ef=state.weight.find(e=>e.date===wd);

    <button class="iconbtn" onclick="editWeightEntry('${e.date}')" title="Bearbeiten">\u270e</button>
    <button class="iconbtn del" onclick="deleteWeight('${e.date}')">\u2715</button>
  </div>`;}).join('');
  return `${hdr()}<div class="ptitle">K\u00f6rper</div>
    <div class="bigstat"><div class="bk">Aktuelles Gewicht</div>
      <div class="bv">${lat?fmt(lat.kg):'\u2014'}<small>${lat?'kg':''}</small></div>
      ${lat&&lat.bf!=null?`<div class="bd" style="color:var(--muted)">${fmt(lat.bf)}% K\u00f6rperfett</div>`:''}${diffHtml}
    </div>
    <div class="chartcard">
      <div class="rangetabs">
        <button class="rangetab${weightRange==='1M'?' active':''}" onclick="setRange('1M')">1 Monat</button>
        <button class="rangetab${weightRange==='1J'?' active':''}" onclick="setRange('1J')">1 Jahr</button>
        <button class="rangetab${weightRange==='ALL'?' active':''}" onclick="setRange('ALL')">Alles</button>
      </div>
      <div class="chart">${bigChart}</div>
    </div>
    <div class="inputcard"><div class="inlabel">${ef?'Eintrag bearbeiten':'Gewicht eintragen'}</div>
      <div class="inrow" style="margin-bottom:8px;">
        <div class="infield"><label>Datum</label><input id="w-date" type="date" max="${todayISO()}" value="${wd}"></div>
      </div>
      <div class="inrow">
        <div class="infield"><label>Gewicht (kg)</label><input id="w-kg" type="number" inputmode="decimal" step="0.1" placeholder="93.0" value="${ef?ef.kg:''}"></div>
        <div class="infield"><label>K\u00f6rperfett %</label><input id="w-bf" type="number" inputmode="decimal" step="0.1" placeholder="\u2013" value="${ef&&ef.bf!=null?ef.bf:''}"></div>
        <button class="savew" onclick="saveWeight()">${ef?'\u00c4ndern':'Speichern'}</button>
      </div>
    </div>
    ${w.length?`<div class="wlist"><div class="wlabel">Alle Eintr\u00e4ge (${w.length})</div>${wrows}</div>`:''}
    <div class="foot">${w.length} Eintr\u00e4ge gespeichert</div>`;
}

function rangeCutoff(){
  const n=new Date();n.setHours(0,0,0,0);
  if(weightRange==='1M'){const d=new Date(n);d.setMonth(d.getMonth()-1);return d.getTime();}
  if(weightRange==='1J'){const d=new Date(n);d.setFullYear(d.getFullYear()-1);return d.getTime();}
  return -Infinity;
}
function buildWeightChart(pts){
  if(!pts.length)return '<div class="empty">Noch keine Daten. Trage unten dein Gewicht ein.</div>';
  if(pts.length===1)return `<svg viewBox="0 0 300 80"><circle cx="150" cy="40" r="5" fill="var(--accent)"/><text x="150" y="26" fill="var(--text)" font-size="13" text-anchor="middle" font-family="Anton">${fmt(pts[0].y)} kg</text></svg>`;
  return buildChart(pts.map(p=>({date:p.date,kg:p.y,rows:[]})));
}

/* ====== ACTIONS ====== */
function deletePlan(){
  if(state.plans.length<=1){alert('Du kannst den letzten Plan nicht löschen. Setze die App stattdessen zurück.');return;}
  if(!confirm('Plan wirklich löschen?'))return;
  state.plans=state.plans.filter(p=>p.id!==state.activePlanId);
  state.activePlanId=state.plans[0].id;
  save();render();
}
function resetApp(){
  if(!confirm('Alle Daten löschen und neu starten?\nDieser Schritt kann nicht rückgängig gemacht werden!'))return;
  try{localStorage.removeItem('tz_newdesign');}catch(e){}
  state=defaultState();
  view='today';openPlanIdx=-1;openProgUnits=null;openExSet={};openCardioSet={};
  render();
}
function goToPlanUnit(i){view='plan';openPlanIdx=i;render();window.scrollTo(0,0);}
function goToPlanUnit(idx){view='plan';openPlanIdx=idx;render();window.scrollTo(0,0);}
function setView(v){view=v;if(v==='progress')openProgUnits=null;render();window.scrollTo(0,0);}
function setHistSub(s){histSub=s;if(s==='progress')openProgUnits=null;render();window.scrollTo(0,0);}
function setProgMetric(m){progMetric=m;render();}
function toggleProgUnit(n){if(!openProgUnits)openProgUnits={};openProgUnits[n]=!openProgUnits[n];render();}
function setRange(r){weightRange=r;render();}
function setWeightDate(v){weightDate=v||todayISO();render();}
function editWeightEntry(d){weightDate=d;render();window.scrollTo(0,0);}
function deleteWeight(d){if(!confirm('L\u00f6schen?'))return;state.weight=state.weight.filter(e=>e.date!==d);if(weightDate===d)weightDate=todayISO();save();render();}
function saveWeight(){
  const kg=parseFloat((document.getElementById('w-kg').value||'').replace(',','.'));
  if(isNaN(kg))return;
  const bf=parseFloat((document.getElementById('w-bf').value||'').replace(',','.'));
  const iso=(document.getElementById('w-date').value)||todayISO();
  const entry={date:iso,kg:Math.round(kg*10)/10};
  if(!isNaN(bf))entry.bf=Math.round(bf*10)/10;
  const i=state.weight.findIndex(w=>w.date===iso);
  if(i>=0)state.weight[i]=entry;else state.weight.push(entry);
  state.weight.sort((a,b)=>a.date.localeCompare(b.date));
  weightDate=todayISO();save();render();
}
function switchPlan(id){state.activePlanId=id;openPlanIdx=-1;save();render();}
function addPlan(){const p={id:makeId(),name:'Neuer Plan',cycle:['Einheit 1'],cycleTypes:[null],anchorISO:todayISO(),anchorDay:1,dayNotes:{},exercises:{}};state.plans.push(p);state.activePlanId=p.id;openPlanIdx=0;save();render();}
function togglePlanUnit(i){openPlanIdx=openPlanIdx===i?-1:i;render();}
function editUnit(i,v){
  const p=activePlan(),old=p.cycle[i];
  if(p.exercises&&p.exercises[old]){const still=p.cycle.some((u,k)=>k!==i&&u===old);if(!still&&v&&v!==old&&p.exercises[v]===undefined){p.exercises[v]=p.exercises[old];delete p.exercises[old];}}
  p.cycle[i]=v;save();
}
function delUnit(i){
  const p=activePlan();if(p.cycle.length<=1)return;
  p.cycle.splice(i,1);if(p.cycleTypes)p.cycleTypes.splice(i,1);
  if(p.anchorDay>p.cycle.length)p.anchorDay=1;
  openPlanIdx=-1;save();render();
}
function addUnit(){const p=activePlan();p.cycle.push('Neue Einheit');if(p.cycleTypes)p.cycleTypes.push(null);openPlanIdx=p.cycle.length-1;save();render();}
function moveUnit(i,dir){
  const p=activePlan(),c=p.cycle,j=i+dir;
  if(j<0||j>=c.length)return;
  [c[i],c[j]]=[c[j],c[i]];
  if(p.cycleTypes)[p.cycleTypes[i],p.cycleTypes[j]]=[p.cycleTypes[j],p.cycleTypes[i]];
  if(openPlanIdx===i)openPlanIdx=j;else if(openPlanIdx===j)openPlanIdx=i;
  save();render();
}
function cycleType(i){
  const p=activePlan();if(!p.cycleTypes)p.cycleTypes=new Array(p.cycle.length).fill(null);
  const oi=TYPE_ORDER.indexOf(p.cycleTypes[i]);
  p.cycleTypes[i]=oi<TYPE_ORDER.length-1?TYPE_ORDER[oi+1]:null;
  save();render();
}
function addExercise(i){const arr=getExercises(i).slice();arr.push({id:makeId(),name:''});setExercises(i,arr);render();}
function renExercise(i,exId,name){const arr=getExercises(i).map(e=>e.id===exId?{...e,name}:e);setExercises(i,arr);}
function delExercise(i,exId){const arr=getExercises(i).filter(e=>e.id!==exId);setExercises(i,arr);render();}
function setToday(i){const p=activePlan();p.anchorISO=todayISO();p.anchorDay=i+1;save();render();}
function toggleDone(){
  const iso=todayISO();if(!state.log[iso])state.log[iso]={};
  const e=state.log[iso];
  if(e.done){e.done=false;}
  else{
    e.done=true;const p=activePlan(),idx=currentIndex();
    e.planId=p.id;e.unit=p.cycle[idx];e.type=getType(idx);e.dayIdx=idx;
  }
  save();render();
}
function addInsert(){
  const d=(document.getElementById('ins-date')||{}).value||todayISO();
  const l=((document.getElementById('ins-label')||{}).value||'').trim()||'Sonder-Einheit';
  if(!state.inserts)state.inserts={};state.inserts[d]={label:l};save();render();
}
function removeInsert(d){if(state.inserts)delete state.inserts[d];save();render();}

(async function(){await load();prefillToday();render();})();
</script>
</body>
</html>
