/* ============ COCKPIT VIEW ============ */
/* Abgeschlossene Einheiten in der aktuellen Woche (Mo-So), ohne Restdays */
function sessionsThisWeek(){
  const mon=weekStartMonday(new Date());
  const monIso=isoOf(mon);
  let done=0;
  Object.keys(state.log).forEach(d=>{
    if(d<monIso) return;
    const e=state.log[d];
    if(e&&e.done&&e.type&&e.type!=='rest') done++;
  });
  return done;
}
/* Geplante Krafteinheiten pro Woche (grobe Schätzung aus Plan) */
function plannedSessionsPerWeek(){
  const p=activePlan();
  if(p.mode==='week'){
    return [1,2,3,4,5,6,0].filter(d=>{ const u=unitById(p.week&&p.week[d]); return u&&u.type!=='rest'; }).length;
  }
  // Zyklus: Anteil Nicht-Rest-Tage auf 7 Tage hochgerechnet
  const nonRest=p.cycle.filter(id=>{ const u=unitById(id); return u&&u.type!=='rest'; }).length;
  if(!p.cycle.length) return 0;
  return Math.round(nonRest/p.cycle.length*7);
}
/* Gesamt-Wochenvolumen diese Woche + Trend ggü. Vorwoche */
function weekVolumeTotal(){
  const {data}=weeklyVolumeData();
  let cur=0, prev=0;
  Object.keys(data).forEach(id=>{ const a=data[id]; cur+=a[a.length-1]||0; prev+=a[a.length-2]||0; });
  return {cur:Math.round(cur), prev:Math.round(prev)};
}
/* Gewichtstrend: neuester Eintrag vs. vorheriger */
function weightTrend(){
  const w=(state.weight||[]).slice().sort((a,b)=>a.date<b.date?-1:1);
  if(!w.length) return null;
  const latest=w[w.length-1];
  const prev=w.length>1?w[w.length-2]:null;
  return {kg:latest.kg, diff:prev?Math.round((latest.kg-prev.kg)*10)/10:null};
}
/* Letzten PR finden: jüngstes Datum, an dem eine Übung ein neues Höchstgewicht erreichte */
function findLastPR(){
  const dates=Object.keys(state.log).sort(); // alt -> neu
  let result=null;
  // pro Unit+Exercise das laufende Maximum verfolgen
  const maxSoFar={};
  dates.forEach(d=>{
    const e=state.log[d]; if(!e||!e.sets) return;
    Object.keys(e.sets).forEach(unitId=>{
      const exObj=e.sets[unitId];
      Object.keys(exObj).forEach(exId=>{
        const rows=normSets(exObj[exId]).rows.filter(r=>!r.warmup&&r.kg!=null);
        if(!rows.length) return;
        const topKg=Math.max(...rows.map(r=>r.kg));
        const key=unitId+'_'+exId;
        if(maxSoFar[key]==null){ maxSoFar[key]=topKg; }
        else if(topKg>maxSoFar[key]){
          maxSoFar[key]=topKg;
          const u=unitById(unitId);
          const exName=u&&(u.exercises||[]).find(x=>x.id===exId);
          result={date:d, exName:exName?exName.name:'\u00dcbung', kg:topKg};
        }
      });
    });
  });
  return result;
}

/* Übungen, die im Plan sind, früher trainiert wurden, aber länger nicht mehr dran kamen */
function findNeglectedExercises(thresholdDays){
  const th=thresholdDays||28;
  const now=isoToDate(todayISO());
  const p=activePlan();
  const ids=p.mode==='week'?Object.values(p.week||{}):p.cycle;
  const seen=new Set(); const out=[];
  ids.forEach(uid=>{
    if(!uid||seen.has(uid)) return;
    const u=unitById(uid); if(!u||u.type==='rest') return;
    seen.add(uid);
    (u.exercises||[]).forEach(ex=>{
      const last=lastSessionFor(uid,ex.id);
      if(!last) return; // noch nie trainiert -> kein "länger nicht"
      const days=Math.floor((now-isoToDate(last.date))/86400000);
      if(days>=th) out.push({name:ex.name, unit:u.name, days, weeks:Math.round(days/7)});
    });
  });
  out.sort((a,b)=>b.days-a.days);
  return out;
}

/* ============ JAHRESRÜCKBLICK "GYM WRAPPED" ============ */
function yearWrapped(year){
  const y=year||new Date().getFullYear();
  const prefix=String(y)+'-';
  const dates=Object.keys(state.log).filter(d=>d.startsWith(prefix)).sort();
  // Trainingstage (echte Einheiten, kein rest)
  let totalSessions=0, totalVolume=0;
  const exCount={};        // exId -> Anzahl Sessions
  const exName={};         // exId -> Name
  const exFirstLast={};    // exId -> {firstKg, lastKg, firstDate, lastDate}
  const monthSessions={};  // 1-12 -> Anzahl
  const monthVolume={};    // 1-12 -> Volumen
  let prCount=0;
  const maxSoFar={};       // für PR-Zählung übers Jahr
  const allTimeMax={};     // Bestwert VOR dem Jahr (für PR-Vergleich)
  // Bestwerte vor dem Jahr ermitteln
  Object.keys(state.log).filter(d=>d<prefix).forEach(d=>{
    const e=state.log[d]; if(!e||!e.sets) return;
    Object.keys(e.sets).forEach(uid=>{
      Object.keys(e.sets[uid]).forEach(exId=>{
        normSets(e.sets[uid][exId]).rows.forEach(r=>{
          if(r.warmup||r.kg==null) return;
          const key=uid+'_'+exId;
          if(allTimeMax[key]==null||r.kg>allTimeMax[key]) allTimeMax[key]=r.kg;
        });
      });
    });
  });
  Object.assign(maxSoFar, allTimeMax);

  dates.forEach(d=>{
    const e=state.log[d]; if(!e) return;
    const mon=parseInt(d.slice(5,7),10);
    if(e.done && e.type && e.type!=='rest'){ totalSessions++; monthSessions[mon]=(monthSessions[mon]||0)+1; }
    if(!e.sets) return;
    Object.keys(e.sets).forEach(uid=>{
      // Volumen dieser Einheit an dem Tag
      const vol=sessionVolume(d,uid).total;
      totalVolume+=vol; monthVolume[mon]=(monthVolume[mon]||0)+vol;
      Object.keys(e.sets[uid]).forEach(exId=>{
        const entry=e.sets[uid][exId];
        if(entry.checked!==true) return;
        const rows=normSets(entry).rows.filter(r=>!r.warmup&&r.kg!=null);
        if(!rows.length) return;
        const key=uid+'_'+exId;
        exCount[key]=(exCount[key]||0)+1;
        const u=unitById(uid);
        const exObj=u&&(u.exercises||[]).find(x=>x.id===exId);
        exName[key]=exObj?exObj.name:'Übung';
        const topKg=Math.max(...rows.map(r=>r.kg));
        // Kraftzuwachs: ersten und letzten Top-Wert des Jahres festhalten
        if(!exFirstLast[key]){ exFirstLast[key]={firstKg:topKg, lastKg:topKg, firstDate:d, lastDate:d}; }
        else { exFirstLast[key].lastKg=topKg; exFirstLast[key].lastDate=d; }
        // PR-Zählung
        if(maxSoFar[key]==null){ maxSoFar[key]=topKg; }
        else if(topKg>maxSoFar[key]){ maxSoFar[key]=topKg; prCount++; }
      });
    });
  });

  // Meist trainierte Übung
  let topEx=null, topExN=0;
  Object.keys(exCount).forEach(k=>{ if(exCount[k]>topExN){ topExN=exCount[k]; topEx=k; } });
  // Größter Kraftzuwachs (absolut in kg, nur wo gesteigert)
  let bestGain=null, bestGainKg=0;
  Object.keys(exFirstLast).forEach(k=>{
    const fl=exFirstLast[k];
    const gain=fl.lastKg-fl.firstKg;
    if(gain>bestGainKg){ bestGainKg=gain; bestGain={key:k, from:fl.firstKg, to:fl.lastKg, gain}; }
  });
  // Stärkster Monat (nach Volumen)
  let topMonth=null, topMonthVol=0;
  Object.keys(monthVolume).forEach(m=>{ if(monthVolume[m]>topMonthVol){ topMonthVol=monthVolume[m]; topMonth=parseInt(m,10); } });
  // Gewichtsverlauf im Jahr
  const wy=(state.weight||[]).filter(w=>w.date&&w.date.startsWith(prefix)).sort((a,b)=>a.date<b.date?-1:1);
  const weightChange=wy.length>=2?{from:wy[0].kg, to:wy[wy.length-1].kg, diff:Math.round((wy[wy.length-1].kg-wy[0].kg)*10)/10}:null;
  // Längste Serie aufeinanderfolgender Trainingswochen (mind. 1 Einheit pro Woche)
  const weeksWithTraining=new Set();
  dates.forEach(d=>{ const e=state.log[d]; if(e&&e.done&&e.type&&e.type!=='rest'){ const mon=weekStartMonday(isoToDate(d)); weeksWithTraining.add(isoOf(mon)); } });
  const sortedWeeks=[...weeksWithTraining].sort();
  let longestStreak=0, curStreak=0, prevWeek=null;
  sortedWeeks.forEach(wk=>{
    if(prevWeek){
      const diff=Math.round((isoToDate(wk)-isoToDate(prevWeek))/(7*86400000));
      curStreak = diff===1 ? curStreak+1 : 1;
    } else curStreak=1;
    if(curStreak>longestStreak) longestStreak=curStreak;
    prevWeek=wk;
  });

  return {
    year:y,
    hasData: dates.length>0,
    totalSessions,
    totalVolume:Math.round(totalVolume),
    topExercise: topEx?{name:exName[topEx], count:topExN}:null,
    biggestGain: bestGain?{name:exName[bestGain.key], from:bestGain.from, to:bestGain.to, gain:bestGain.gain}:null,
    strongestMonth: topMonth?{month:topMonth, volume:topMonthVol}:null,
    weightChange,
    longestStreak,
    prCount
  };
}
const MONTH_NAMES=['Januar','Februar','M\u00e4rz','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

/* Soll der Jahresrückblick-Button gerade sichtbar sein? -> null (nein) oder Jahreszahl (ja) */
function wrappedSeasonYear(){
  const now=new Date();
  const m=now.getMonth(); // 0=Jan ... 11=Dez
  if(m===11) return now.getFullYear();   // Dezember: aktuelles Jahr
  if(m===0) return now.getFullYear()-1;  // Januar: Vorjahr
  return null;                            // sonst: kein Button
}
/* Steuerung Jahresrückblick */
function openWrapped(year){
  wrappedData=yearWrapped(year||new Date().getFullYear());
  wrappedCard=0; wrappedOpen=true; render(); scrollAppTop();
}
function closeWrapped(){ wrappedOpen=false; render(); }
function wrappedCards(){
  const w=wrappedData; if(!w) return [];
  const cards=[];
  cards.push({type:'intro'});
  cards.push({type:'sessions'});
  cards.push({type:'volume'});
  if(w.topExercise) cards.push({type:'topex'});
  if(w.biggestGain) cards.push({type:'gain'});
  if(w.strongestMonth) cards.push({type:'month'});
  if(w.weightChange) cards.push({type:'weight'});
  if(w.longestStreak>0) cards.push({type:'streak'});
  cards.push({type:'prs'});
  cards.push({type:'outro'});
  return cards;
}
function wrappedNext(){
  const n=wrappedCards().length;
  if(wrappedCard>=n-1){ closeWrapped(); return; }
  wrappedCard++; render();
}
function wrappedPrev(){ if(wrappedCard>0){ wrappedCard--; render(); } }

  } else if(t==='streak'){

      <div class="wr-bignum">${w.longestStreak}<span class="wr-unit">Wochen</span></div>

    inner=`<div class="wr-kicker">Neue pers\u00f6nliche Rekorde</div>
      <div class="wr-bignum">${w.prCount}<span class="wr-unit">\ud83c\udf89</span></div>

function renderCockpit(){
  const now=new Date();
  const greeting=now.getHours()<11?'Guten Morgen':now.getHours()<18?'Servus':'Guten Abend';
  // Daten
  const doneWk=sessionsThisWeek();
  const planWk=plannedSessionsPerWeek();
  const vol=weekVolumeTotal();
  let volTrend='';
  if(vol.prev>0){ const pct=Math.round((vol.cur-vol.prev)/vol.prev*100);
    volTrend=pct>0?`<span class="ck-up">+${pct}% \u2191</span>`:pct<0?`<span class="ck-down">${pct}% \u2193</span>`:`<span class="ck-flat">\u00b10%</span>`;
  } else if(vol.cur>0){ volTrend=`<span class="ck-flat">erste Woche</span>`; }
  const wt=weightTrend();
  const pr=findLastPR();
  // nächste/heutige Einheit
  const iso=todayISO();
  const todayInsert=(state.inserts||{})[iso];
  const tUid=todayUnitId();
  const tU=unitById(tUid);
  const todayDone=state.log[iso]&&state.log[iso].done;
  let nextLabel, nextSub;
  if(todayInsert){ nextLabel=todayInsert.label; nextSub='Sonder-Einheit heute'; }
  else if(tU){
    nextLabel=tU.name;
    nextSub=todayDone?'heute \u2713 abgeschlossen':(tU.type==='rest'?'heute \u00b7 Active Rest':'heute dran');
  } else { nextLabel='Frei'; nextSub='heute keine Einheit'; }

  // Kacheln
  const tiles=[];
  // Einheiten diese Woche
  tiles.push(`<div class="ck-tile">
    <div class="ck-tile-label">Einheiten diese Woche</div>
    <div class="ck-tile-big">${doneWk}${planWk?`<span class="ck-tile-of"> / ${planWk}</span>`:''}</div>
    <div class="ck-tile-sub">${doneWk===0?'noch keine':doneWk>=planWk&&planWk>0?'Wochenziel erreicht! \ud83d\udd25':'weiter so'}</div>
  </div>`);
  // Wochenvolumen
  tiles.push(`<div class="ck-tile">
    <div class="ck-tile-label">Wochenvolumen</div>
    <div class="ck-tile-big">${vol.cur>0?fmt(Math.round(vol.cur/100)/10)+'<span class="ck-tile-of"> t</span>':'\u2013'}</div>
    <div class="ck-tile-sub">${volTrend||'noch keine Daten'}</div>
  </div>`);
  // Gewicht
  if(wt){
    let wd='';
    if(wt.diff!=null) wd=wt.diff>0?`<span class="ck-up">+${fmt(wt.diff)} kg</span>`:wt.diff<0?`<span class="ck-down">${fmt(wt.diff)} kg</span>`:`<span class="ck-flat">stabil</span>`;
    tiles.push(`<div class="ck-tile">
      <div class="ck-tile-label">K\u00f6rpergewicht</div>
      <div class="ck-tile-big">${fmt(wt.kg)}<span class="ck-tile-of"> kg</span></div>
      <div class="ck-tile-sub">${wd||'erster Eintrag'}</div>
    </div>`);
  }
  // Letzter PR
  if(pr){
    const d=isoToDate(pr.date);
    tiles.push(`<div class="ck-tile">
      <div class="ck-tile-label">Letzter Rekord \ud83c\udf89</div>
      <div class="ck-tile-big sm">${fmt(pr.kg)}<span class="ck-tile-of"> kg</span></div>
      <div class="ck-tile-sub">${escapeHtml(short(pr.exName,20))} \u00b7 ${d.getDate()}.${d.getMonth()+1}.</div>
    </div>`);
  }

  // Länger nicht trainiert (dezenter Hinweis, kein Alarm)
  const neglected=findNeglectedExercises(28);
  let neglectHtml='';
  if(neglected.length){
    const shown=neglected.slice(0,3).map(n=>`<b>${escapeHtml(short(n.name,18))}</b> (${n.weeks} Wo.)`).join(', ');
    const more=neglected.length>3?` <span class="ck-neglect-more">+${neglected.length-3} weitere</span>`:'';
    neglectHtml=`<div class="ck-neglect">
      <span class="ck-neglect-ico">\u23f3</span>
      <span class="ck-neglect-txt">L\u00e4nger nicht trainiert: ${shown}${more}</span>
    </div>`;
  }

  const wrYear=wrappedSeasonYear();
  const wrappedBtn=wrYear?`<button class="ck-wrapped" onclick="openWrapped(${wrYear})">
      <span class="ck-wrapped-ico">\u2728</span>
      <span class="ck-wrapped-txt"><b>Gym Wrapped ${wrYear}</b><br><span class="ck-wrapped-sub">Dein Jahresr\u00fcckblick \u2013 jetzt ansehen</span></span>
      <span class="ck-wrapped-arr">\u2192</span>
    </button>`:'';
  return `
    ${header()}
    <div class="ck-hero">
      <div class="ck-greet">${greeting}!</div>
      <div class="ck-next">
        <div class="ck-next-label">${todayDone&&!todayInsert?'Heute erledigt':'Als N\u00e4chstes'}</div>
        <div class="ck-next-name">${escapeHtml(nextLabel)}</div>
        <div class="ck-next-sub">${nextSub}</div>
      </div>
      <button class="ck-cta" onclick="setView('today')">${todayDone?'Zum Training \u2192':'Training starten \u2192'}</button>
    </div>
    <div class="ck-tiles">${tiles.join('')}</div>
    ${neglectHtml}
    ${wrappedBtn}
  `;
}

/* ============ PROGRESSIONSLOGIK ============ */
/* Standard-Parameter pro Regeltyp */
const PROG_DEFAULTS={
  double:{sets:4, repMin:8, repMax:12, step:2.5},
  strength:{sets:4, reps:12, step:2.5},
  technique:{}
};
/* Letzten Session für eine Übung holen (nur Arbeitssätze, kein Aufwärmen) */
function lastWorkingSetsFor(unitId,exId){
  const last=lastSessionFor(unitId,exId);
  if(!last) return null;
  const workRows=last.rows.filter(r=>!r.warmup&&r.kg!=null);
  return workRows.length?{date:last.date, rows:workRows}:null;
}
/* Progression berechnen: gibt {suggestion, hint} zurück oder null */
function calcNextSession(exercise, unitId){
  const prog=exercise&&exercise.prog;
  if(!prog||prog.type==='off'||!prog.type) return null;
  // Technik/Reha: immer anzeigen, keine letzte Session nötig
  if(prog.type==='technique'){
    return {suggestion:'Gewicht halten \u00b7 saubere Ausf\u00fchrung priorisieren', hint:'technique'};
  }
  const last=lastWorkingSetsFor(unitId, exercise.id);
  if(!last||!last.rows.length) return null;
  const rows=last.rows;
  if(prog.type==='double'){
    const p={...PROG_DEFAULTS.double, ...prog};
    const topKg=Math.max(...rows.map(r=>r.kg||0));
    const topRows=rows.filter(r=>r.kg===topKg);
    // Nur Sätze beim höchsten Gewicht prüfen — gemischte Gewichte gelten nicht als "fertig"
    const allAtMax=topRows.length>=p.sets && topRows.every(r=>{const mr=rowMetricReps(r);return mr!=null&&mr>=p.repMax;});
    if(allAtMax){
      const next=Math.round((topKg+p.step)*100)/100;
      return {suggestion:`\u2197 Auf ${fmt(next)} kg steigern \u00b7 Ziel ${p.repMin}\u00d7${p.sets}`,hint:'increase',nextKg:next};
    } else {
      return {suggestion:`${fmt(topKg)} kg halten \u00b7 Ziel ${p.repMax} Wdh in allen S\u00e4tzen`,hint:'hold',targetReps:p.repMax};
    }
  }
  if(prog.type==='strength'){
    const p={...PROG_DEFAULTS.strength, ...prog};
    const topKg=Math.max(...rows.map(r=>r.kg||0));
    const topRows=rows.filter(r=>r.kg===topKg);
    // Nur Sätze beim höchsten Gewicht prüfen
    const allAtTarget=topRows.length>=p.sets && topRows.every(r=>{const mr=rowMetricReps(r);return mr!=null&&mr>=p.reps;});
    if(allAtTarget){
      const next=Math.round((topKg+p.step)*100)/100;
      return {suggestion:`\u2197 Auf ${fmt(next)} kg steigern \u00b7 Ziel ${p.reps} Wdh`,hint:'increase',nextKg:next};
    } else {
      return {suggestion:`${fmt(topKg)} kg halten \u00b7 Ziel ${p.reps} Wdh in allen S\u00e4tzen`,hint:'hold',targetReps:p.reps};
    }
  }
  return null;
}
/* Progressionsregel setzen/ändern */
function setExProg(unitId,exId,type){
  const u=unitById(unitId); if(!u) return;
  const ex=(u.exercises||[]).find(e=>e.id===exId); if(!ex) return;
  if(type==='off'){ delete ex.prog; }
  else {
    const def=PROG_DEFAULTS[type]||{};
    ex.prog=Object.assign({type}, ex.prog&&ex.prog.type===type?ex.prog:{}, {type}, def);
  }
  save(); render();
}
function setExProgParam(unitId,exId,param,val){
  const u=unitById(unitId); if(!u) return;
  const ex=(u.exercises||[]).find(e=>e.id===exId); if(!ex||!ex.prog) return;
  const num=parseFloat(String(val).replace(',','.'));
  if(!isNaN(num)&&num>0) ex.prog[param]=num;
  save();
}
/* Einarmig-Flag pro Übung umschalten */
function toggleExUni(unitId,exId){
  const u=unitById(unitId); if(!u) return;
  const ex=(u.exercises||[]).find(e=>e.id===exId); if(!ex) return;
  if(ex.uni) delete ex.uni; else ex.uni=true;
  save(); render();
}
/* Cardio-Flag pro Übung umschalten (Übung wird zu Zeit/Puls statt Sätze) */
function toggleExCardio(unitId,exId){
  const u=unitById(unitId); if(!u) return;
  const ex=(u.exercises||[]).find(e=>e.id===exId); if(!ex) return;
  if(ex.cardio){ delete ex.cardio; }
  else {
    ex.cardio=true;
    // Kraft-spezifische Flags entfernen, da bei Cardio sinnlos
    delete ex.prog; delete ex.uni; delete ex.assist;
    recordCardioName(exId, ex.name);
  }
  save(); render();
}
/* Assistiert-Flag pro Übung umschalten (Gewicht hilft -> negativ) */
function toggleExAssist(unitId,exId){
  const u=unitById(unitId); if(!u) return;
  const ex=(u.exercises||[]).find(e=>e.id===exId); if(!ex) return;
  if(ex.assist) delete ex.assist; else ex.assist=true;
  save(); render();
}
/* Soll der kg-Wert dieser Zeile negativ (assistiert) sein? */
function assistRowNeg(r){ return r.kg!=null ? r.kg<0 : (r.neg!==false); }
/* Vorzeichen einer kg-Eingabe umschalten (assistiert <-> Zusatzgewicht) */
function flipKgSign(unitName,exId,rowIdx){
  const entry=ensureExEntry(unitName,exId);
  if(entryIsEmpty(entry)){ const pf=prefillRowsFor(unitName,exId); if(pf) entry.rows=pf; }
  while(entry.rows.length<=rowIdx) entry.rows.push({kg:null,reps:null});
  const r=entry.rows[rowIdx];
  if(r.kg!=null){ r.kg=-r.kg; r.neg=r.kg<0; }
  else { r.neg=!(r.neg!==false); } // noch kein Wert: nur Vorzeichen-Präferenz umschalten
  save(); render();
}
/* kg-Eingabe als Betrag speichern, Vorzeichen aus Präferenz/aktuellem Wert */
function saveSetRowAbs(unitName,exId,rowIdx,val){
  const entry=ensureExEntry(unitName,exId);
  if(entryIsEmpty(entry)){ const pf=prefillRowsFor(unitName,exId); if(pf) entry.rows=pf; }
  while(entry.rows.length<=rowIdx) entry.rows.push({kg:null,reps:null});
  const r=entry.rows[rowIdx];
  const neg=assistRowNeg(r);
  const raw=val===''?null:parseFloat(val.replace(',','.'));
  const mag=(raw!=null&&!isNaN(raw))?Math.abs(raw):null;
  r.kg=(mag!=null)?(neg?-mag:mag):null;
  r.neg=neg;
  save();
  updatePRBadge(unitName,exId,rowIdx,r);
}

/* ============ CARDIO LOG ============ */
/* CARDIO_UNITS entfernt - Aktivitaeten kommen aus unit.exercises (DEFAULT_CARDIO + ensureCardioUnits). */

function cardioSummary(d){
  const parts=[];
  if(d.min!=null) parts.push(`${d.min} min`);
  if(d.avgPulse!=null) parts.push(`\u00d8 ${d.avgPulse} bpm`);
  else if(d.maxPulse!=null) parts.push(`max ${d.maxPulse} bpm`);
  return parts.length?parts.join(' \u00b7 '):'keine Werte';
}
function cardioLogHtml(entry, unit){

  const units=acts.map(act=>{
    const key=act.id;
    const d=cd[key]||{};
    const checked=!!d.done;
    const open=isCardioOpen(key,checked);
    const body=`<div class="cardio-fields">
        <div class="cfield"><label>DAUER (min)</label>
          <input type="number" inputmode="numeric" min="0" max="999" placeholder="15"
            value="${d.min!=null?d.min:''}" oninput="saveCardio('${key}','min',this.value)"></div>
      </div>
      <div class="pulse-row">
        <div class="cfield"><label>\u2665 \u00d8-PULS (bpm)</label>
          <input type="number" inputmode="numeric" min="0" max="250" placeholder="\u2013"
            value="${d.avgPulse!=null?d.avgPulse:''}" oninput="saveCardio('${key}','avgPulse',this.value)"></div>
        <div class="cfield"><label>\u2665 MAX-PULS (bpm)</label>
          <input type="number" inputmode="numeric" min="0" max="250" placeholder="\u2013"
            value="${d.maxPulse!=null?d.maxPulse:''}" oninput="saveCardio('${key}','maxPulse',this.value)"></div>
      </div>`;
    return `<div class="ex-card${checked?' checked':''}">
      <div class="ex-head" onclick="toggleCardioOpen('${key}')">
        <button class="ex-check ${checked?'on':''}" onclick="event.stopPropagation();toggleCardioUnit('${key}')">\u2713</button>
        <div class="ex-headtxt">
          <div class="ex-name">\ud83c\udfc3 ${escapeHtml(act.name||'Cardio')}</div>
          ${checked?`<div class="ex-sub">${escapeHtml(cardioSummary(d))}</div>`:''}
        </div>
        ${!checked?`<span class="ex-chev">${open?'\u2303':'\u2304'}</span>`:''}
      </div>
      ${(open&&!checked)?`<div class="ex-body">${body}</div>`:''}
    </div>`;
  }).join('');
  const note=(entry.cardioNote||'');
  return `<div class="ex-list">${units}</div>
    <div class="cfield" style="margin-top:10px;">
      <label style="font-size:11px;color:var(--muted);letter-spacing:1px;">NOTIZ (optional)</label>
      <textarea class="note-ta" style="margin-top:4px;" placeholder="z.B. Heute Zone 2 super gehalten..." oninput="updateCardioNote(this.value)">${escapeHtml(note)}</textarea>
    </div>`;
}

function getLogToday(){
  const iso=todayISO();
  if(!state.log[iso]) state.log[iso]={};
  return state.log[iso];
}
function toggleCardioUnit(key){
  const e=getLogToday();
  if(!e.cardio) e.cardio={};
  if(!e.cardio[key]) e.cardio[key]={};
  e.cardio[key].done=!e.cardio[key].done;
  // beim Abhaken zuklappen, beim Aufheben aufklappen
  openCardioSet[key]=e.cardio[key].done?false:true;
  save(); render();
}
function isCardioOpen(key,checked){
  if(key in openCardioSet) return openCardioSet[key];
  return !checked; // default: offen, außer abgehakt
}
function toggleCardioOpen(key){
  const e=getLogToday();
  const checked=!!(e.cardio&&e.cardio[key]&&e.cardio[key].done);
  if(checked) return; // abgehakt = gesperrt
  openCardioSet[key]=!isCardioOpen(key,checked);
  render();
}
function saveCardio(key,field,val){
  const e=getLogToday();
  if(!e.cardio) e.cardio={};
  if(!e.cardio[key]) e.cardio[key]={};
  const n=val===''?null:parseInt(val,10);
  e.cardio[key][field]=(n!=null&&!isNaN(n))?n:null;
  save();
}
function updateCardioNote(v){
  const e=getLogToday(); e.cardioNote=v; save();
  autoresize('.note-ta');
}

function unitForISO(iso){
  const e=state.log[iso];
  if(e&&e.unitId){ const u=unitById(e.unitId); return {unitId:e.unitId, unit:u?u.name:(e.unit||'\u2014'), type:e.type||(u?u.type:'other')}; }
  if(e&&e.unit){ return {unitId:null, unit:e.unit, type:e.type||typeOf(e.unit)}; } // Altdaten-Fallback
  const p=activePlan();
  if(p.mode==='week'){ const wd=isoToDate(iso).getDay(); const id=(p.week&&p.week[wd])||''; const u=unitById(id); return {unitId:id, unit:u?u.name:'\u2014', type:u?u.type:'other'}; }
  const len=p.cycle.length;
  if(!len) return {unitId:null, unit:'\u2014', type:'other'};
  const idx=indexForISO(iso);
  const id=p.cycle[idx]; const u=unitById(id);
  return {unitId:id, unit:u?u.name:'\u2014', type:u?u.type:'other'};
}

/* Wochenvolumen pro Einheit: Summe kg×Wdh (nur Arbeitssätze) aller Sessions
   einer Unit-ID innerhalb einer Kalenderwoche (Mo–So), letzte 4 Wochen. */
function weekStartMonday(d){
  const x=new Date(d); x.setHours(0,0,0,0);
  const off=(x.getDay()+6)%7; // Mo=0
  x.setDate(x.getDate()-off);
  return x;
}
function weeklyVolumeData(){
  const WEEKS=4;
  const mon0=weekStartMonday(new Date());
  const starts=[];
  for(let i=WEEKS-1;i>=0;i--){ const s=new Date(mon0); s.setDate(s.getDate()-i*7); starts.push(s); }
  const startIso=starts.map(isoOf);
  // Einheiten in Verwendung (kein Rest)
  const p=activePlan();
  const ids=p.mode==='week'?Object.values(p.week||{}):p.cycle;
  const seen=new Set(); const units=[];
  ids.forEach(id=>{ if(!id||seen.has(id)) return; const u=unitById(id); if(!u||u.type==='rest') return; seen.add(id); units.push(u); });
  // pro Unit ein Array mit 4 Wochensummen
  const data={};
  units.forEach(u=>{ data[u.id]=new Array(WEEKS).fill(0); });
  const firstMon=starts[0];
  Object.keys(state.log).forEach(date=>{
    const e=state.log[date]; if(!e||!e.unitId||!data[e.unitId]) return;
    const dd=isoToDate(date); if(dd<firstMon) return;
    const wkMon=weekStartMonday(dd); const wi=startIso.indexOf(isoOf(wkMon));
    if(wi<0) return;
    data[e.unitId][wi]+=sessionVolume(date,e.unitId).total;
  });
  return {units, starts, data};
}
function historyVolumeHtml(){
  const {units, starts, data}=weeklyVolumeData();
  if(!units.length) return `<div class="empty-state">Noch keine Einheiten f\u00fcr die Volumen-Auswertung.</div>`;
  // gibt es überhaupt Daten?
  const anyData=units.some(u=>data[u.id].some(v=>v>0));
  if(!anyData) return `<div class="empty-state">Noch keine abgeschlossenen Sessions in den letzten 4 Wochen.<br>Sobald du trainierst, erscheint hier dein Wochenvolumen pro Einheit.</div>`;
  const wkLabels=starts.map((s,i)=>{
    if(i===starts.length-1) return 'diese';
    const diff=starts.length-1-i;
    return 'vor '+diff;
  });
  const cards=units.map(u=>{
    const vals=data[u.id];
    if(!vals.some(v=>v>0)) return '';
    const max=Math.max(...vals,1);
    const cur=vals[vals.length-1];
    const prev=vals[vals.length-2]||0;
    let trend='';
    if(prev>0){ const d=cur-prev; const pct=Math.round(d/prev*100);
      if(d>0) trend=`<span class="vol-up">+${pct}% ggü. Vorwoche \u2191</span>`;
      else if(d<0) trend=`<span class="vol-down">${pct}% ggü. Vorwoche \u2193</span>`;
      else trend=`<span class="vol-flat">gleich wie Vorwoche</span>`;
    } else if(cur>0){ trend=`<span class="vol-flat">erste Trainingswoche</span>`; }
    const bars=vals.map((v,i)=>{
      const h=Math.round(v/max*100);
      const isCur=i===vals.length-1;
      return `<div class="volbar-col">
        <div class="volbar-wrap"><div class="volbar ${isCur?'cur':''}" style="height:${Math.max(h,2)}%"></div></div>
        <div class="volbar-val">${v>0?fmt(Math.round(v/100)/10)+'t':'\u2013'}</div>
        <div class="volbar-lbl ${isCur?'cur':''}">${wkLabels[i]}</div>
      </div>`;
    }).join('');
    return `<div class="volcard">
      <div class="volcard-head">
        <span class="tdot ${u.type}"></span>
        <span class="vol-name">${escapeHtml(u.name)}</span>
        <span class="vol-cur">${fmt(cur)}<small> kg</small></span>
      </div>
      ${trend?`<div class="vol-trend">${trend}</div>`:''}
      <div class="volbars">${bars}</div>
    </div>`;
  }).filter(Boolean).join('');
  return `<div class="hint" style="margin-bottom:14px;">Bewegtes Gewicht pro Einheit und Woche (nur Arbeitss\u00e4tze, Mo\u2013So). „t" = Tonnen.</div>${cards}`;
}

/* ============ TEILEN: Session als Bild ============ */
let _h2cLoading=null;
function ensureHtml2Canvas(){
  if(window.html2canvas) return Promise.resolve(window.html2canvas);
  if(_h2cLoading) return _h2cLoading;
  _h2cLoading=new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    s.onload=()=>resolve(window.html2canvas);
    s.onerror=()=>{ _h2cLoading=null; reject(new Error('html2canvas konnte nicht geladen werden (bist du online?)')); };
    document.head.appendChild(s);
  });
  return _h2cLoading;
}
/* Baut die statische Bild-Card einer Session (konkrete Übungen + Sätze, gemischt Kraft/Cardio) */
function buildShareCardHtml(iso){
  const e=state.log[iso]||{};
  const info=unitForISO(iso);
  const insert=(state.inserts||{})[iso];
  const unit=unitById(e.unitId||info.unitId);
  const d=new Date(iso+'T00:00:00');
  const dateStr=WEEKDAYS[d.getDay()]+', '+d.getDate()+'. '+MONTHS[d.getMonth()]+' '+d.getFullYear();
  const unitName=insert?insert.label:(unit?unit.name:(info.unit||'Training'));
  const type=insert?'other':(unit?unit.type:info.type);
  let exRows=''; let exCount=0, cardioCount=0;
  if(unit&&Array.isArray(unit.exercises)){
    const sets=(e.sets&&e.sets[unit.id])||{};
    unit.exercises.forEach(ex=>{
      const isCardio=unit.cardio||ex.cardio;
      if(isCardio){
        const cd=(e.cardio&&e.cardio[ex.id])||{};
        if(!cd.done && cd.min==null && cd.avgPulse==null && cd.maxPulse==null) return;
        cardioCount++;
        exRows+=`<div class="sc-ex"><div class="sc-exn">\ud83c\udfc3 ${escapeHtml(ex.name||'Cardio')}</div><div class="sc-exs">${escapeHtml(cardioSummary(cd)||'\u2014')}</div></div>`;
      } else {
        const s=sets[ex.id]; if(!s) return;
        const rows=normSets(s).rows.filter(r=>r.kg!=null||r.reps!=null||isUniRow(r));
        if(!rows.length) return;
        exCount++;
        const setsTxt=rows.map(r=>{
          const kg=r.kg!=null?(r.kg<0?String(r.kg):fmt(r.kg)):'?';
          return `${kg}\u00d7${fmtRowReps(r)}${r.warmup?' \u00b7A':''}`;
        }).join('   ');
        exRows+=`<div class="sc-ex"><div class="sc-exn">${escapeHtml(ex.name||'\u00dcbung')}</div><div class="sc-exs">${escapeHtml(setsTxt)}</div></div>`;
      }
    });
  }
  if(!exRows) exRows=`<div class="sc-ex"><div class="sc-exs" style="color:var(--muted)">Keine Detaildaten erfasst.</div></div>`;
  const vol=unit?sessionVolume(iso,unit.id):{total:0};
  const stats=[];
  if(vol.total>0) stats.push(`<div class="sc-stat"><b>${fmt(Math.round(vol.total/100)/10)}<small> t</small></b><span>bewegt</span></div>`);
  if(exCount>0) stats.push(`<div class="sc-stat"><b>${exCount}</b><span>\u00dcbung${exCount>1?'en':''}</span></div>`);
  if(cardioCount>0) stats.push(`<div class="sc-stat"><b>${cardioCount}</b><span>Cardio</span></div>`);
  const note=e.sessionNote?`<div class="sc-note">\u201e${escapeHtml(short(e.sessionNote.replace(/\n/g,' '),90))}\u201c</div>`:'';
  return `
    <div class="sc-top">
      <div class="sc-brand"><span class="sc-dot"></span><span class="sc-brandtxt">TRAININGSZYKLUS</span></div>
      <div class="sc-date">${escapeHtml(dateStr)}</div>
    </div>
    <div class="sc-unit"><span class="sc-tdot ${type}"></span><span class="sc-unittxt">${escapeHtml(unitName)}</span></div>
    <div class="sc-exlist">${exRows}</div>
    ${note}
    ${stats.length?`<div class="sc-stats">${stats.join('')}</div>`:''}
    <div class="sc-foot">gogadon.github.io</div>`;
}
async function shareSession(iso){
  try{
    const h2c=await ensureHtml2Canvas();
    let host=document.getElementById('sharehost');
    if(!host){ host=document.createElement('div'); host.id='sharehost'; document.body.appendChild(host); }
    host.style.cssText='position:fixed;left:-9999px;top:0;width:380px;z-index:-1;';
    host.innerHTML=`<div id="sharecardEl" class="sharecard">${buildShareCardHtml(iso)}</div>`;
    const el=document.getElementById('sharecardEl');
    const canvas=await h2c(el,{backgroundColor:'#0c0c0e',scale:2,logging:false});
    host.innerHTML='';
    const blob=await new Promise(res=>canvas.toBlob(res,'image/png'));
    if(!blob){ throw new Error('Bild konnte nicht erzeugt werden'); }
    const file=new File([blob],`training-${iso}.png`,{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:'Mein Training'});
    } else {
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a'); a.href=url; a.download=`training-${iso}.png`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
    }
  }catch(err){
    if(err&&err.name==='AbortError') return; // Nutzer hat Teilen-Dialog abgebrochen
    alert('Teilen hat nicht geklappt: '+(err&&err.message?err.message:'Unbekannter Fehler'));
  }
}

function historyActivityHtml(){
  const N=42;
  const now=new Date(); now.setHours(0,0,0,0);
  const todayIso=todayISO();
  let doneCount=0;
  let rows='';
  for(let k=0;k<N;k++){
    const d=new Date(now); d.setDate(d.getDate()-k);
    const iso=isoOf(d);
    const insert=(state.inserts||{})[iso];
    const info=unitForISO(iso);
    const displayName=insert?insert.label:info.unit;
    const displayType=insert?'other':info.type;
    const e=state.log[iso]||{};
    const done=!!e.done;
    if(done) doneCount++;
    const isToday=iso===todayIso;
    let summaryHtml='';
    if(done){
      if(insert){
        // Einschub: nur Name, keine Session-Daten
      } else {
        const segs=[];
        // Kraft-Übungen (Sätze)
        const sets=e.sets&&e.sets[info.unitId];
        if(sets){
          const n=Object.keys(sets).filter(exId=>exCountsOnDay(sets,exId)).length;
          if(n) segs.push(`${n} \u00dcbung${n>1?'en':''}`);
        }
        // Cardio (eigene Cardio-Einheit ODER Cardio-Übungen in einer Kraft-Einheit)
        if(e.cardio && Object.keys(e.cardio).some(k=>e.cardio[k]&&e.cardio[k].done)){
          const cu=unitById(e.unitId||info.unitId);
          const acts=(cu&&Array.isArray(cu.exercises))?cu.exercises:[];
          const nameFor=key=>{ const a=acts.find(x=>x.id===key); if(a&&a.name) return a.name; if(state.cardioNames&&state.cardioNames[key]) return state.cardioNames[key]; const def=DEFAULT_CARDIO.find(x=>x.id===key); return def?def.name:key; };
          Object.keys(e.cardio).filter(key=>e.cardio[key]&&e.cardio[key].done).forEach(key=>{
            const d=e.cardio[key]; let s=nameFor(key);
            if(d.min) s+=` ${d.min}min`;
            if(d.avgPulse) s+=` \u00d8${d.avgPulse}`;
            segs.push(s);
          });
        }
        if(e.sessionNote) segs.push(short(e.sessionNote.replace(/\n/g,' '),30));
        if(segs.length) summaryHtml=`<div class="hcardio">${escapeHtml(segs.join(' \u00b7 '))}</div>`;
      }
    }
    rows+=`<div class="hrow ${done?'done':''}">
      <div class="hdate"><div class="d">${d.getDate()}</div><div class="m">${MONTHS[d.getMonth()]}</div><div class="hwd">${WD_SHORT[d.getDay()]}</div></div>
      <div class="tdot ${displayType}"></div>
      <div class="hunit">${escapeHtml(displayName)}${isToday?' &nbsp;<span class="htoday">HEUTE</span>':''}${insert?` <span style="font-size:10px;color:var(--push);font-weight:700;">EINSCHUB</span>`:''}${summaryHtml}</div>
      ${(done&&!insert)?`<button class="hshare" onclick="shareSession('${iso}')" title="Als Bild teilen">\u2191</button>`:''}
      <div class="hcheck">\u2713</div>
    </div>`;
  }
  return `
    <div class="psub">Deine letzten ${N} Tage. Tippe auf der Heute-Seite \u201eAls erledigt markieren\u201c, dann erscheinen sie hier abgehakt.</div>
    <div class="summary">
      <div class="scard"><div class="v">${doneCount}</div><div class="k">erledigt (${N} Tage)</div></div>
      <div class="scard"><div class="v">${Math.round(doneCount/N*7*10)/10}</div><div class="k">\u00d8 pro Woche</div></div>
    </div>
    ${rows}
    <div class="foot">Tage ohne H\u00e4kchen wurden (noch) nicht als erledigt markiert.</div>
  `;
}

/* Fortschritt: pro Einheit + Übung die Gewichtsentwicklung */
function historyProgressHtml(){
  const p=activePlan();
  // verwendete Units (dedupliziert) aus Zyklus oder Wochenplan
  const ids=p.mode==='week'?Object.values(p.week||{}):p.cycle;
  const seen=new Set(); const units=[];
  ids.forEach(id=>{
    if(!id||seen.has(id)) return;
    const u=unitById(id); if(!u||u.type==='rest') return;
    seen.add(id); units.push({id, name:u.name, type:u.type});
  });

  // metric: 'top' = höchstes kg des Tages, 'avg' = Durchschnitt — NUR Arbeitssätze
  function metricKg(rows){
    const vals=rows.filter(r=>!r.warmup).map(r=>r.kg).filter(v=>v!=null&&!isNaN(v));
    if(!vals.length) return null;
    if(progMetric==='avg') return vals.reduce((a,b)=>a+b,0)/vals.length;
    return Math.max(...vals);
  }
  // Sessions einer Übung sammeln: {date, kg(metrik), rows, note}
  function seriesFor(unitId,exId){
    const out=[];
    Object.keys(state.log).sort().forEach(d=>{
      const s=state.log[d]&&state.log[d].sets&&state.log[d].sets[unitId];
      if(s&&s[exId]&&exCountsOnDay(s,exId)){
        const n=normSets(s[exId]);
        const kg=metricKg(n.rows);
        if(kg!=null) out.push({date:d, kg:kg, rows:n.rows, note:(state.log[d].sessionNote||'')});
      }
    });
    return out;
  }

  let anyData=false;
  // Auto-Open: aktuelle Einheit (nur Krafttag, kein Restday/Einschub)
  const todayInsert2=(state.inserts||{})[todayISO()];
  const curId=todayUnitId();
  const curU=unitById(curId);
  const autoOpenId=(todayInsert2||!curU||curU.type==='rest')?null:curId;
  if(openProgUnits===null){
    openProgUnits={};
    if(autoOpenId) openProgUnits[autoOpenId]=true;
  }

  const blocks=units.map(u=>{
    const ex=getExercisesByUnitId(u.id);
    if(!ex.length) return '';
    const cards=ex.map(e=>{
      const series=seriesFor(u.id,e.id);
      if(!series.length) return '';
      anyData=true;
      const latest=series[series.length-1];
      const first=series[0];
      const diff=Math.round((latest.kg-first.kg)*10)/10;
      let trendCls='flat', trendTxt='gleich geblieben';
      if(series.length>1&&diff>0){ trendCls='up'; trendTxt=`+${fmt(diff)} kg seit Start \ud83d\udcc8`; }
      else if(series.length>1&&diff<0){ trendCls='down'; trendTxt=`${fmt(diff)} kg seit Start`; }
      else if(series.length===1){ trendCls='flat'; trendTxt='erster Eintrag'; }
      const total=series.length;
      const ptsKey=u.id+'|'+e.id;
      const expanded=!!openProgPoints[ptsKey];
      const LIMIT=5;
      const showCount=expanded?total:Math.min(LIMIT,total);
      // Sätze sauber darstellen: nur ganze Sätze, nie mitten im Wert abgeschnitten
      function fmtSets(rows){
        const all=rows.filter(r=>r.kg!=null);
        const maxShow=4;
        const shown=all.slice(0,maxShow).map(r=>`${fmt(r.kg)}\u00d7${fmtRowReps(r)}${r.warmup?' (W)':''}`);
        let txt=shown.join(', ');
        if(all.length>maxShow) txt+=` +${all.length-maxShow}`;
        return txt;
      }
      let ppHtml='';
      for(let k=0;k<showCount;k++){
        const realIdx=total-1-k; // neueste zuerst
        const s=series[realIdx];
        const prev=realIdx>0?series[realIdx-1]:null;
        let kgCls='';
        if(prev){ if(s.kg>prev.kg) kgCls='inc'; else if(s.kg<prev.kg) kgCls='dec'; }
        const d=isoToDate(s.date);
        const setsTxt=fmtSets(s.rows);
        ppHtml+=`<div class="pp">
          <span class="ppd">${d.getDate()}.${d.getMonth()+1}.${String(d.getFullYear()).slice(2)}</span>
          <span class="ppk ${kgCls}">${fmt(s.kg)} kg${kgCls==='inc'?' \u2191':kgCls==='dec'?' \u2193':''}</span>
          <span class="ppn">${escapeHtml(setsTxt)}${s.note?' \u00b7 '+escapeHtml(short(s.note.replace(/\n/g,' '),22)):''}</span>
        </div>`;
      }
      const moreBtn=total>LIMIT
        ? `<button class="pp-more" onclick="toggleProgPoints('${escapeAttr(ptsKey)}')">${expanded?'Weniger anzeigen \u2303':'Alle '+total+' anzeigen \u2304'}</button>`
        : '';
      return `<div class="progcard">
        <div class="pc-head"><div class="pc-name">${escapeHtml(e.name||'(unbenannt)')}</div>
          <div class="pc-now">${fmt(latest.kg)}<small> kg</small></div></div>
        <div class="pc-trend ${trendCls}">${trendTxt}</div>
        ${buildExerciseChart(series)}
        <div class="pc-points">${ppHtml}</div>
        ${moreBtn}
      </div>`;
    }).filter(Boolean).join('');
    if(!cards) return '';
    const isOpen=!!openProgUnits[u.id];
    return `<div class="prog-unit">
      <div class="pu-head ${isOpen?'open':''}" onclick="toggleProgUnit('${escapeAttr(u.id)}')">
        <span class="tdot ${u.type}"></span>
        <span class="pu-name">${escapeHtml(u.name)}</span>
        <span class="pu-chev">${isOpen?'\u2303':'\u2304'}</span>
      </div>
      ${isOpen?`<div class="pu-body">${cards}</div>`:''}
    </div>`;
  }).filter(Boolean).join('');

  if(!anyData){
    return `<div class="prog-empty">Noch keine Trainingsdaten erfasst.<br><br>
      Hake auf der <b>Training</b>-Seite einen Tag ab und trage bei den \u00dcbungen deine Gewichte ein.
      Sobald du dieselbe Einheit mehrmals geloggt hast, siehst du hier deine Entwicklung.</div>`;
  }
  const toggle=`<div class="metrictabs">
    <button class="metrictab ${progMetric==='top'?'active':''}" onclick="setProgMetric('top')">Top-Satz</button>
    <button class="metrictab ${progMetric==='avg'?'active':''}" onclick="setProgMetric('avg')">\u00d8 Schnitt</button>
  </div>`;
  return `<div class="psub">Gewichtsentwicklung pro \u00dcbung. \u2191 erh\u00f6ht / \u2193 verringert gegen\u00fcber dem vorigen Mal.</div>
    ${toggle}${blocks}`;
}

/* Mini-Chart für eine Übungs-Serie */
function buildExerciseChart(series){
  if(series.length<2) return '';
  const W=300,H=90,padL=8,padR=8,padT=10,padB=10;
  const xs=series.map(s=>isoToDate(s.date).getTime());
  const ys=series.map(s=>s.kg);
  let minX=Math.min(...xs),maxX=Math.max(...xs);
  let minY=Math.min(...ys),maxY=Math.max(...ys);
  if(minY===maxY){ minY-=1; maxY+=1; }
  const ry=maxY-minY; minY-=ry*0.2; maxY+=ry*0.2;
  if(minX===maxX){ minX-=1; maxX+=1; }
  const sx=x=>padL+(x-minX)/(maxX-minX)*(W-padL-padR);
  const sy=y=>padT+(1-(y-minY)/(maxY-minY))*(H-padT-padB);
  const line=series.map((s,i)=>(i?'L':'M')+sx(isoToDate(s.date).getTime()).toFixed(1)+' '+sy(s.kg).toFixed(1)).join(' ');
  const area=`M${sx(minX).toFixed(1)} ${(H-padB).toFixed(1)} `+series.map(s=>'L'+sx(isoToDate(s.date).getTime()).toFixed(1)+' '+sy(s.kg).toFixed(1)).join(' ')+` L${sx(maxX).toFixed(1)} ${(H-padB).toFixed(1)} Z`;
  const dots=series.map(s=>`<circle cx="${sx(isoToDate(s.date).getTime()).toFixed(1)}" cy="${sy(s.kg).toFixed(1)}" r="2.4" fill="var(--accent)"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;margin:2px 0 4px;">
    <defs><linearGradient id="eg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#eg)"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
  </svg>`;
}

/* ============ BODY VIEW ============ */
function rangeCutoff(){
  const now=new Date(); now.setHours(0,0,0,0);
  if(weightRange==='1M'){ const d=new Date(now); d.setMonth(d.getMonth()-1); return d.getTime(); }
  if(weightRange==='1J'){ const d=new Date(now); d.setFullYear(d.getFullYear()-1); return d.getTime(); }
  return -Infinity;
}
function renderBody(){
  const w=state.weight.slice().sort((a,b)=>a.date.localeCompare(b.date));
  const latest=w.length?w[w.length-1]:null;
  const first=w.length?w[0]:null;
  let diffHtml='';
  if(latest&&first&&w.length>1){
    const diff=Math.round((latest.kg-first.kg)*10)/10;
    const cls=diff<=0?'down':'up';
    const sign=diff>0?'+':'';
    diffHtml=`<div class="bd ${cls}">${sign}${diff} kg seit erstem Eintrag</div>`;
  }
  const cut=rangeCutoff();
  const pts=w.filter(e=>isoToDate(e.date).getTime()>=cut).map(e=>({x:isoToDate(e.date).getTime(), y:e.kg, date:e.date}));
  const wd=weightDate||todayISO();
  const entryForDate=state.weight.find(e=>e.date===wd);

  return `
    ${header()}
    <div class="ptitle">K\u00f6rper</div>
    <div class="psub">Halte dein Gewicht fest und sieh deinen Verlauf \u00fcber die Zeit.</div>

    <div class="bigstat">
      <div class="bk">Aktuelles Gewicht</div>

      ${diffHtml}
    </div>

    <div class="chartcard">
      <div class="rangetabs">
        <button class="rangetab ${weightRange==='1M'?'active':''}" onclick="setRange('1M')">1 Monat</button>
        <button class="rangetab ${weightRange==='1J'?'active':''}" onclick="setRange('1J')">1 Jahr</button>
        <button class="rangetab ${weightRange==='ALL'?'active':''}" onclick="setRange('ALL')">Alles</button>
      </div>
      <div class="chart">${buildChart(pts)}</div>
    </div>

    <div class="inputcard">
      <div class="il">${entryForDate?'Eintrag bearbeiten':'Gewicht eintragen'}</div>
      <div class="datefield infield"><label>Datum</label>
        <input id="w-date" type="date" max="${todayISO()}" value="${wd}" onchange="setWeightDate(this.value)"></div>
      <div class="inrow">
        <div class="infield"><label>Gewicht (kg)</label>
          <input id="w-kg" type="number" inputmode="decimal" step="0.1" placeholder="93.0" value="${entryForDate?entryForDate.kg:''}"></div>
        <div class="infield"><label>K\u00f6rperfett % <span style="opacity:.6">(optional)</span></label>
          <input id="w-bf" type="number" inputmode="decimal" step="0.1" placeholder="\u2013" value="${entryForDate&&entryForDate.bf!=null?entryForDate.bf:''}"></div>
        <button class="savew" onclick="saveWeight()">${entryForDate?'\u00c4ndern':'Speichern'}</button>
      </div>
    </div>

    ${w.length?`<div class="wlist">
      <div class="wlist-h">Alle Eintr\u00e4ge (${w.length})</div>
      ${w.slice().reverse().map(e=>{
        const d=isoToDate(e.date);
        const ed=(weightDate||todayISO())===e.date;
        return `<div class="wentry ${ed?'editing':''}">
          <div class="wmain" onclick="editWeightEntry('${e.date}')">
            <div class="wdt">${WD_SHORT[d.getDay()]}, ${d.getDate()}. ${MONTHS[d.getMonth()]} ${d.getFullYear()}</div>
            <div class="wkg">${fmt(e.kg)}<small>kg</small></div>
            ${e.bf!=null?`<div class="wbf">${fmt(e.bf)}% KF</div>`:''}
          </div>
          ${ed?'<div class="wedit">BEARB.</div>':''}
          <button class="iconbtn del" onclick="deleteWeight('${e.date}')">\u2715</button>
        </div>`;
      }).join('')}
    </div>`:''}

    <div class="foot">Du kannst auch r\u00fcckwirkend eintragen \u2013 einfach oben das Datum w\u00e4hlen.</div>
  `;
}

function buildChart(pts){
  if(!pts.length) return '<div class="empty">Noch keine Daten in diesem Zeitraum.<br>Trage unten dein Gewicht ein.</div>';
  const W=340,H=170,padL=36,padR=14,padT=16,padB=26;
  if(pts.length===1){
    const cx=W/2, cy=H/2;
    return `<svg viewBox="0 0 ${W} ${H}"><circle cx="${cx}" cy="${cy}" r="5" fill="var(--accent)"/>`
      +`<text x="${cx}" y="${cy-14}" fill="var(--text)" font-size="14" text-anchor="middle" font-family="Anton">${fmt(pts[0].y)} kg</text></svg>`;
  }
  const xs=pts.map(p=>p.x), ys=pts.map(p=>p.y);
  let minX=Math.min(...xs), maxX=Math.max(...xs);
  let minY=Math.min(...ys), maxY=Math.max(...ys);
  if(minY===maxY){ minY-=1; maxY+=1; }
  const ry=maxY-minY; minY-=ry*0.12; maxY+=ry*0.12;
  if(minX===maxX){ minX-=86400000; maxX+=86400000; }
  const sx=x=>padL+(x-minX)/(maxX-minX)*(W-padL-padR);
  const sy=y=>padT+(1-(y-minY)/(maxY-minY))*(H-padT-padB);

  // gridlines (3 horizontal)
  let grid='', labels='';
  for(let g=0;g<=2;g++){
    const val=minY+(maxY-minY)*(g/2);
    const yy=sy(val);
    grid+=`<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="var(--line)" stroke-width="1"/>`;
    labels+=`<text x="${padL-6}" y="${yy+3}" fill="var(--muted)" font-size="9" text-anchor="end">${fmt(val)}</text>`;
  }
  const line=pts.map((p,i)=>(i?'L':'M')+sx(p.x).toFixed(1)+' '+sy(p.y).toFixed(1)).join(' ');
  const area=`M${sx(pts[0].x).toFixed(1)} ${(H-padB).toFixed(1)} `+pts.map(p=>'L'+sx(p.x).toFixed(1)+' '+sy(p.y).toFixed(1)).join(' ')+` L${sx(pts[pts.length-1].x).toFixed(1)} ${(H-padB).toFixed(1)} Z`;
  const dots=pts.map(p=>`<circle cx="${sx(p.x).toFixed(1)}" cy="${sy(p.y).toFixed(1)}" r="2.6" fill="var(--accent)"/>`).join('');
  // x labels: first & last date
  const f=pts[0], l=pts[pts.length-1];
  const fd=isoToDate(f.date), ld=isoToDate(l.date);
  const xlab=`<text x="${padL}" y="${H-6}" fill="var(--muted)" font-size="9" text-anchor="start">${fd.getDate()}.${fd.getMonth()+1}.</text>`
    +`<text x="${W-padR}" y="${H-6}" fill="var(--muted)" font-size="9" text-anchor="end">${ld.getDate()}.${ld.getMonth()+1}.</text>`;
  return `<svg viewBox="0 0 ${W} ${H}">
    <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    ${grid}${labels}
    <path d="${area}" fill="url(#ag)"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}${xlab}
  </svg>`;
}

const OB_SUGGEST=[
  {name:'R\u00fccken \u00b7 Bizeps', type:'pull', ex:['Lat-Zug','Rudern','Bizeps-Curl']},
  {name:'Brust \u00b7 Schulter \u00b7 Trizeps', type:'push', ex:['Bankdr\u00fccken','Schulterdr\u00fccken','Trizeps-Dr\u00fccken']},
  {name:'Beine \u00b7 Nacken', type:'legs', ex:['Beinpresse','Beinbeuger','Nackenheben']},
  {name:'Push', type:'push', ex:['Bankdr\u00fccken','Schulterdr\u00fccken','Trizeps-Dr\u00fccken']},
  {name:'Pull', type:'pull', ex:['Klimmzug','Rudern','Bizeps-Curl']},
  {name:'Legs', type:'legs', ex:['Kniebeuge','Beinpresse','Wadenheben']},
  {name:'Oberk\u00f6rper', type:'push', ex:['Bankdr\u00fccken','Rudern','Schulterdr\u00fccken']},
  {name:'Unterk\u00f6rper', type:'legs', ex:['Kniebeuge','Beinpresse','Beinbeuger']},
  {name:'Ganzk\u00f6rper', type:'other', ex:['Kniebeuge','Bankdr\u00fccken','Rudern']},
  {name:'Active Rest', type:'rest', ex:[]}
];
function restartOnboarding(){
  if(!confirm('Wirklich alles l\u00f6schen und neu einrichten? Das kann nicht r\u00fcckg\u00e4ngig gemacht werden.')) return;
  state=emptyState(); needsOnboarding=true; ob=null; obInit();
  save(); render(); scrollAppTop();
}
function obInit(){
  ob={ step:1, mode:'cycle', units:[], cycle:[], week:{0:'',1:'',2:'',3:'',4:'',5:'',6:''}, openUnit:null, pick:null };
}
function obSetMode(m){ ob.mode=m; render(); }
function obAddSuggest(idx){
  const s=OB_SUGGEST[idx];
  const uid='u_'+makeId();
  ob.units.push({id:uid, name:s.name, type:s.type, exercises:s.ex.map(n=>({id:makeId(), name:n}))});
  ob.openUnit=uid; render();
}
function obAddCustomUnit(){
  const el=document.getElementById('ob-unit-name');
  const name=(el&&el.value.trim())||'';
  if(!name) return;
  const uid='u_'+makeId();
  ob.units.push({id:uid, name, type:'other', exercises:[]});
  ob.openUnit=uid; render();
}
function obUnit(uid){ return ob.units.find(u=>u.id===uid); }
function obRenameUnit(uid,v){ const u=obUnit(uid); if(u) u.name=v; }
function obCycleType(uid){ const u=obUnit(uid); if(!u) return; const oi=TYPE_ORDER.indexOf(u.type); u.type=TYPE_ORDER[(oi+1)%TYPE_ORDER.length]; render(); }
function obDelUnit(uid){
  ob.units=ob.units.filter(u=>u.id!==uid);
  ob.cycle=ob.cycle.filter(id=>id!==uid);
  Object.keys(ob.week).forEach(d=>{ if(ob.week[d]===uid) ob.week[d]=''; });
  if(ob.openUnit===uid) ob.openUnit=null;
  render();
}
function obToggleUnit(uid){ ob.openUnit=ob.openUnit===uid?null:uid; render(); }
function obAddEx(uid){ const u=obUnit(uid); if(u){ u.exercises.push({id:makeId(), name:''}); render(); } }
function obRenameEx(uid,exId,v){ const u=obUnit(uid); if(u){ const e=u.exercises.find(x=>x.id===exId); if(e) e.name=v; } }
function obDelEx(uid,exId){ const u=obUnit(uid); if(u){ u.exercises=u.exercises.filter(x=>x.id!==exId); render(); } }
function obAddToCycle(uid){ ob.cycle.push(uid); ob.pick=null; render(); }
function obRemoveCycle(i){ ob.cycle.splice(i,1); render(); }
function obMoveCycle(i,dir){ const j=i+dir; if(j<0||j>=ob.cycle.length) return; [ob.cycle[i],ob.cycle[j]]=[ob.cycle[j],ob.cycle[i]]; render(); }
function obOpenPick(ctx){ ob.pick=ctx; render(); }
function obPick(uid){
  if(ob.pick==='cycle') ob.cycle.push(uid);
  else if(typeof ob.pick==='string'&&ob.pick.startsWith('week:')){ ob.week[+ob.pick.split(':')[1]]=uid; }
  ob.pick=null; render();
}
function obClearWeek(day){ ob.week[day]=''; render(); }
function obNext(){
  if(ob.step===1){ ob.step=2; render(); scrollAppTop(); return; }
  if(ob.step===2){
    if(!ob.units.length){ alert('Lege mindestens eine Einheit an.'); return; }
    // Zyklus mit allen Einheiten vorbefüllen (in Reihenfolge), Wochenplan leer lassen
    if(ob.mode==='cycle'&&!ob.cycle.length) ob.cycle=ob.units.map(u=>u.id);
    ob.step=3; render(); scrollAppTop(); return;
  }
}
function obBack(){ if(ob.step>1){ ob.step--; render(); scrollAppTop(); } }
function obFinish(){
  // Validierung
  if(ob.mode==='cycle'&&!ob.cycle.length){ alert('F\u00fcge mindestens einen Tag zum Zyklus hinzu.'); return; }
  if(ob.mode==='week'&&!Object.values(ob.week).some(Boolean)){ alert('Weise mindestens einem Wochentag eine Einheit zu.'); return; }
  // State aufbauen
  const units={};
  ob.units.forEach(u=>{ units[u.id]={id:u.id, name:u.name, type:u.type, exercises:u.exercises.filter(e=>e.name.trim()).map(e=>({id:e.id, name:e.name.trim()}))}; });
  const p={ id:makeId(), name:'Mein Plan', mode:ob.mode,
    cycle:ob.mode==='cycle'?ob.cycle.slice():[],
    week:ob.mode==='week'?Object.assign({},ob.week):{0:'',1:'',2:'',3:'',4:'',5:'',6:''},
    anchorISO:todayISO(), anchorDay:1 };
  state={ units, plans:[p], activePlanId:p.id, log:{}, weight:[], inserts:{} };
  needsOnboarding=false; ob=null; view='today';
  save(); render(); scrollAppTop();
}

function renderOnboarding(){
  if(!ob) obInit();
  const step=ob.step;
  const dots=[1,2,3].map(n=>`<span class="ob-dot ${n===step?'on':''} ${n<step?'done':''}"></span>`).join('');

  if(step===1){
    return `<div class="ob">
      <div class="ob-steps">${dots}</div>
      <div class="ob-hero">
        <div class="ob-emoji">\ud83d\udcaa</div>
        <h1 class="ob-title">Willkommen!</h1>
        <p class="ob-text">Lass uns in 3 schnellen Schritten deinen Trainingsplan einrichten. Du kannst sp\u00e4ter alles \u00e4ndern.</p>
      </div>
      <div class="ob-q">Wie trainierst du?</div>
      <button class="ob-choice ${ob.mode==='cycle'?'on':''}" onclick="obSetMode('cycle')">
        <div class="ob-choice-h">\ud83d\udd01 Zyklus <span class="ob-rec">empfohlen bei flexiblen Tagen</span></div>
        <div class="ob-choice-t">Eine rotierende Abfolge (z.B. Pull \u00b7 Push \u00b7 Pause \u00b7 Beine \u2026). L\u00e4uft unabh\u00e4ngig vom Wochentag und wartet, bis du eine Einheit abschlie\u00dft.</div>
      </button>
      <button class="ob-choice ${ob.mode==='week'?'on':''}" onclick="obSetMode('week')">
        <div class="ob-choice-h">\ud83d\udcc5 Wochenplan</div>
        <div class="ob-choice-t">Feste Wochentage \u2013 z.B. Montag Oberk\u00f6rper, Dienstag Unterk\u00f6rper, Mittwoch Pause. Jede Woche gleich.</div>
      </button>
      <button class="ob-next" onclick="obNext()">Weiter \u2192</button>
    </div>`;
  }

  if(step===2){
    const sugg=OB_SUGGEST.map((s,i)=>{
      const added=ob.units.some(u=>u.name===s.name);
      return `<button class="ob-sugg ${added?'used':''}" onclick="obAddSuggest(${i})" ${added?'disabled':''}>
        <span class="uchip-dot ${s.type}"></span>${escapeHtml(s.name)} ${added?'\u2713':'+'}</button>`;
    }).join('');
    const unitCards=ob.units.map(u=>{
      const open=ob.openUnit===u.id;
      const isRestU=u.type==='rest';
      return `<div class="pcard">
        <div class="pcard-head ${open?'open':''}" onclick="obToggleUnit('${u.id}')">
          <button class="tdot-btn ${u.type}" onclick="event.stopPropagation();obCycleType('${u.id}')" title="Farbe"></button>
          <input class="pname-inp" value="${escapeAttr(u.name)}" onclick="event.stopPropagation()" oninput="obRenameUnit('${u.id}',this.value)" placeholder="Einheit-Name">
          ${!isRestU?`<span class="pexcount">${u.exercises.length} \u00dcb.</span>`:'<span class="pexcount rest">Cardio</span>'}
          <span class="pchev">${open?'\u2303':'\u2304'}</span>
        </div>
        ${open?`<div class="pcard-body">
          ${isRestU?`<div class="ex-empty">Active Rest \u2013 hier wird sp\u00e4ter dein Cardio eingetragen, keine \u00dcbungen n\u00f6tig.</div>`:`
          <div class="exdef">
            <div class="exlabel">\u00dcbungen f\u00fcr \u201e${escapeHtml(short(u.name,22))}\u201c</div>
            ${u.exercises.map(e=>`<div class="exrow">
              <input value="${escapeAttr(e.name)}" placeholder="\u00dcbungsname" oninput="obRenameEx('${u.id}','${e.id}',this.value)">
              <button class="iconbtn del" onclick="obDelEx('${u.id}','${e.id}')">\u2715</button>
            </div>`).join('')}
            <button class="ex-add" onclick="obAddEx('${u.id}')">+ \u00dcbung hinzuf\u00fcgen</button>
          </div>`}
          <div class="pcard-actions">
            <button class="parrow del" onclick="event.stopPropagation();obDelUnit('${u.id}')">\u2715 Einheit l\u00f6schen</button>
          </div>
        </div>`:''}
      </div>`;
    }).join('');
    return `<div class="ob">
      <div class="ob-steps">${dots}</div>
      <h1 class="ob-title sm">Deine Einheiten</h1>
      <p class="ob-text">Tippe Vorschl\u00e4ge an oder erstelle eigene. \u00d6ffne eine Einheit, um \u00dcbungen hinzuzuf\u00fcgen.</p>

      <div class="ob-suggs">${sugg}</div>

        <button onclick="obAddCustomUnit()">+</button>
      </div>
      ${ob.units.length?`<div class="ob-q" style="margin-top:18px;">Angelegt (${ob.units.length})</div>
        <div class="planlist">${unitCards}</div>`:'<div class="ex-empty" style="margin-top:14px;">Noch keine Einheit angelegt.</div>'}
      <div class="ob-navrow">
        <button class="ob-back" onclick="obBack()">\u2190 Zur\u00fcck</button>
        <button class="ob-next" onclick="obNext()">Weiter \u2192</button>
      </div>
    </div>`;
  }

  // step 3
  let body='';
  if(ob.mode==='cycle'){
    const seq=ob.cycle.map((uid,i)=>{
      const u=obUnit(uid); const t=u?u.type:'other';
      return `<div class="seqrow">
        <span class="sq-num">${i+1}</span><span class="tdot ${t}"></span>
        <span class="sq-name">${escapeHtml(short(u?u.name:'\u2014',22))}</span>
        <button class="sq-btn" onclick="obMoveCycle(${i},-1)">\u25b2</button>
        <button class="sq-btn" onclick="obMoveCycle(${i},1)">\u25bc</button>
        <button class="sq-btn del" onclick="obRemoveCycle(${i})">\u2715</button>
      </div>`;
    }).join('');
    const pick=ob.pick==='cycle'?`<div class="unit-picker"><div class="up-head"><span>Welche Einheit anh\u00e4ngen?</span><button class="up-close" onclick="obOpenPick(null)">\u2715</button></div>
      <div class="up-chips">${ob.units.map(u=>`<button class="uchip ${u.type}" onclick="obPick('${u.id}')"><span class="uchip-dot ${u.type}"></span>${escapeHtml(short(u.name,22))}</button>`).join('')}</div></div>`
      :`<button class="addbtn" onclick="obOpenPick('cycle')">+ Tag hinzuf\u00fcgen</button>`;
    body=`<div class="ob-q">Reihenfolge im Zyklus</div>
      <p class="ob-text">Die Abfolge l\u00e4uft in dieser Reihenfolge und wiederholt sich. Du kannst Einheiten mehrfach einbauen.</p>
      <div class="seqlist">${seq||'<div class="ex-empty">Noch kein Tag.</div>'}</div>
      ${pick}`;
  } else {
    const rows=[1,2,3,4,5,6,0].map(day=>{
      const uid=ob.week[day]; const u=uid?obUnit(uid):null;
      const picking=ob.pick==='week:'+day;
      return `<div class="wkrow">
        <div class="wk-day">${WEEKDAYS[day]}</div>
        <button class="wk-assign ${u?'':'empty'}" onclick="obOpenPick('week:${day}')">
          ${u?`<span class="tdot ${u.type}"></span>${escapeHtml(short(u.name,20))}`:'+ Einheit w\u00e4hlen'}
        </button>
        ${u?`<button class="wk-clear" onclick="obClearWeek(${day})">\u2715</button>`:''}
        ${picking?`<div class="unit-picker"><div class="up-head"><span>Einheit f\u00fcr ${WEEKDAYS[day]}</span><button class="up-close" onclick="obOpenPick(null)">\u2715</button></div>
          <div class="up-chips">${ob.units.map(u2=>`<button class="uchip ${u2.type}" onclick="obPick('${u2.id}')"><span class="uchip-dot ${u2.type}"></span>${escapeHtml(short(u2.name,22))}</button>`).join('')}</div></div>`:''}
      </div>`;
    }).join('');
    body=`<div class="ob-q">Wochentage zuweisen</div>
      <p class="ob-text">Weise jedem Tag eine Einheit zu. Leere Tage sind frei.</p>
      <div class="wklist">${rows}</div>`;
  }
  return `<div class="ob">
    <div class="ob-steps">${dots}</div>
    <h1 class="ob-title sm">Fast fertig!</h1>
    ${body}
    <div class="ob-navrow">
      <button class="ob-back" onclick="obBack()">\u2190 Zur\u00fcck</button>
      <button class="ob-next" onclick="obFinish()">Los geht's! \ud83d\ude80</button>
    </div>
  </div>`;
}

/* ============ DATA VIEW ============ */
function renderData(){
  const planCount=state.plans.length;
  let dayCount=0;
  Object.keys(state.log).forEach(d=>{ if(state.log[d]&&state.log[d].done) dayCount++; });
  const weightCount=state.weight.length;
  const insertCount=Object.keys(state.inserts||{}).length;
  return `
    ${header()}
    <div class="ptitle">Daten</div>
    <div class="psub">Hier sicherst du deine komplette Trainings-App. Der Export enth\u00e4lt Pl\u00e4ne, Trainingstage, Gewichte, Sonder-Einheiten und Notizen.</div>

    <div class="datacard">
      <div class="dc-label">Backup erstellen</div>
      <div class="dc-text">Speichert eine JSON-Datei auf deinem Handy. Diese Datei kannst du danach wieder importieren oder als Sicherheitskopie behalten.</div>
      <button class="dc-btn primary" onclick="exportBackup()">Backup herunterladen</button>
      <div class="dc-meta">Aktueller Stand: <b>${planCount}</b> Plan(e), <b>${dayCount}</b> Trainingstag(e), <b>${weightCount}</b> Gewichtseintrag/Eintr\u00e4ge, <b>${insertCount}</b> Sonder-Einheit(en).</div>
    </div>

    <div class="datacard">
      <div class="dc-label">Backup importieren</div>
      <div class="dc-text">Importiert eine vorher gespeicherte JSON-Datei. Achtung: Der aktuelle Speicher in diesem Browser wird dabei ersetzt.</div>
      <button class="dc-btn ghost" onclick="document.getElementById('import-file').click()">Backup ausw\u00e4hlen</button>
      <input id="import-file" type="file" accept="application/json,.json" style="display:none" onchange="importBackup(this)">
    </div>

    <div class="datacard">
      <div class="dc-label">Einrichtung wiederholen</div>
      <div class="dc-text">Startet das Onboarding neu und setzt die App komplett zur\u00fcck (alle Pl\u00e4ne, Einheiten, Trainingstage und Gewichte werden gel\u00f6scht).</div>
      <button class="dc-btn ghost" style="border-color:var(--push);color:var(--push);" onclick="restartOnboarding()">App zur\u00fccksetzen & neu einrichten</button>
    </div>

    <div class="datacard" style="box-shadow:inset 0 0 0 1px rgba(205,253,52,.18);">
      <div class="dc-label">\u2728 Gym Wrapped (Test)</div>
      <div class="dc-text">Jahresr\u00fcckblick als Vorschau \u00f6ffnen \u2013 unabh\u00e4ngig vom Datum. Im normalen Betrieb erscheint der Button automatisch nur im Dezember &amp; Januar (im Cockpit und Verlauf). Dieser Test-Zugang kann sp\u00e4ter entfernt werden.</div>
      <button class="dc-btn ghost" onclick="openWrapped(${new Date().getFullYear()})">R\u00fcckblick ${new Date().getFullYear()} \u00f6ffnen</button>
    </div>

    <div class="foot">Tipp: Erstelle vor gr\u00f6\u00dferen \u00c4nderungen oder vor einem Browserwechsel immer ein Backup.</div>
  `;
}

function exportBackup(){
  try{
    state.lastBackup=todayISO();
    const data=JSON.stringify(state,null,2);
    const blob=new Blob([data],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    const d=new Date();
    const stamp=d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
    a.href=url; a.download='trainingszyklus-backup-'+stamp+'.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    save(); render();
  }catch(e){ alert('Export fehlgeschlagen: '+e.message); }
}
/* Tage seit letztem Backup (null = noch nie) */
function daysSinceBackup(){
  if(!state.lastBackup) return null;
  return diffDays(todayISO(), state.lastBackup);
}
function importBackup(input){
  const file=input.files&&input.files[0];
  if(!file) return;
  if(!confirm('Aktuellen Speicher wirklich mit dem Backup ersetzen? Das kann nicht r\u00fcckg\u00e4ngig gemacht werden.')){ input.value=''; return; }
  const reader=new FileReader();
  reader.onload=function(){
    try{
      const obj=JSON.parse(reader.result);
      if(!obj||!Array.isArray(obj.plans)) throw new Error('Ung\u00fcltige Datei');
      state=obj;
      if(!state.units||typeof state.units!=='object') state.units=defaultUnits();
      if(!state.log) state.log={};
      if(!Array.isArray(state.weight)) state.weight=[];
      if(!state.inserts) state.inserts={};
      state.plans.forEach(p=>{ if(!p.mode) p.mode='cycle'; if(!Array.isArray(p.cycle)) p.cycle=[]; if(!p.week) p.week={0:'',1:'',2:'',3:'',4:'',5:'',6:''}; });
      if(!state.activePlanId||!state.plans.find(p=>p.id===state.activePlanId)) state.activePlanId=state.plans[0].id;
      save(); view='today'; render();
      alert('Backup erfolgreich importiert!');
    }catch(e){ alert('Import fehlgeschlagen: '+e.message); }
    input.value='';
  };
  reader.readAsText(file);
}

/* ============ ACTIONS ============ */
function upcomingInserts(days){
  const out=[], ins=state.inserts||{};
  const now=new Date(); now.setHours(0,0,0,0);
  for(let k=0;k<days;k++){
    const d=new Date(now); d.setDate(d.getDate()+k);
    const iso=isoOf(d);
    if(ins[iso]) out.push({date:iso, label:ins[iso].label});
  }
  return out;
}
function addInsert(){
  const dateEl=document.getElementById('ins-date');
  const labelEl=document.getElementById('ins-label');
  const date=(dateEl&&dateEl.value)||todayISO();
  const label=(labelEl&&labelEl.value.trim())||'Sonder-Einheit';
  if(!state.inserts) state.inserts={};
  state.inserts[date]={label};
  save(); render();
}
function removeInsert(date){
  if(state.inserts) delete state.inserts[date];
  save(); render();
}
function scrollAppTop(){ const a=document.getElementById('app'); if(a&&a.scrollTo) a.scrollTo(0,0); else if(a) a.scrollTop=0; if(window.scrollTo) window.scrollTo(0,0); }
function setView(v){ view=v; openNoteIdx=-1; editing=false; if(v!=='plan'){ planOpenIdx=-1; planNameEdit=false; pickerFor=null; libOpenId=null; } render(); scrollAppTop(); }
function gotoPlanUnit(i){ view='plan'; editing=false; planOpenIdx=i; render(); scrollAppTop(); }
function gotoPlanUnitId(unitId){ const p=activePlan(); const i=p.cycle.indexOf(unitId); view='plan'; editing=false; planOpenIdx=i>=0?i:-1; render(); scrollAppTop(); }
function gotoPlanTermine(){ view='plan'; editing=false; render(); setTimeout(()=>{ const el=document.getElementById('termine-anchor'); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); },60); }
function togglePlanCard(i){ planOpenIdx=(planOpenIdx===i)?-1:i; render(); }
function togglePlanNameEdit(){ planNameEdit=!planNameEdit; render(); }
function setHistSub(s){ histSub=s; if(s==='progress') openProgUnits=null; render(); scrollAppTop(); }
function setProgMetric(m){ progMetric=m; render(); }
function toggleProgUnit(id){ if(!openProgUnits) openProgUnits={}; openProgUnits[id]=!openProgUnits[id]; render(); }
function toggleProgPoints(key){ openProgPoints[key]=!openProgPoints[key]; render(); }
function setRange(r){ weightRange=r; render(); }
function setWeightDate(v){ weightDate=v||todayISO(); render(); }
function editWeightEntry(date){ weightDate=date; render(); scrollAppTop(); }
function deleteWeight(date){
  if(!confirm('Diesen Eintrag l\u00f6schen?')) return;
  state.weight=state.weight.filter(e=>e.date!==date);
  if(weightDate===date) weightDate=todayISO();
  save(); render();
}
function toggleEdit(){ editing=!editing; openNoteIdx=-1; render(); }
function togglePicker(){ const p=document.getElementById('picker'); if(p) p.classList.toggle('show'); }
function switchPlan(id){ state.activePlanId=id; editing=false; openNoteIdx=-1; planOpenIdx=-1; planNameEdit=false; save(); render(); }
function addPlan(){
  // neuer Plan mit einer frischen Einheit
  const uid='u_'+makeId();
  state.units[uid]={id:uid, name:'Einheit 1', type:'other', exercises:[]};
  const p={id:makeId(), name:'Neuer Plan', mode:'cycle', cycle:[uid],
    week:{0:'',1:'',2:'',3:'',4:'',5:'',6:''}, anchorISO:todayISO(), anchorDay:1};
  state.plans.push(p); state.activePlanId=p.id; planNameEdit=true; planOpenIdx=-1; save(); render();
}
function deletePlan(id){
  if(!confirm('Plan wirklich l\u00f6schen?')) return;
  state.plans=state.plans.filter(p=>p.id!==id);
  state.activePlanId=state.plans[0].id; editing=false; save(); render();
}
function editPlanName(v){ activePlan().name=v; save(); }
function setToday(i){ const p=activePlan(); p.anchorISO=todayISO(); p.anchorDay=i+1; save(); render(); }
const TYPE_ORDER=['pull','push','legs','rest','other'];
/* Typ/Farbe der Unit umschalten (gilt überall wo die Unit verwendet wird) */
function cycleTypeUnit(unitId){
  const u=unitById(unitId); if(!u) return;
  const oi=TYPE_ORDER.indexOf(u.type);
  u.type=TYPE_ORDER[(oi+1)%TYPE_ORDER.length];
  save(); render();
}
/* Unit umbenennen (gilt überall) */
function renameUnit(unitId,v){
  const u=unitById(unitId); if(!u) return;
  u.name=v; save();
}
/* Einheit aus dem Zyklus entfernen (Unit-Definition bleibt in der Bibliothek erhalten) */
function delUnit(i){
  const p=activePlan();
  if(p.cycle.length<=1) return;
  p.cycle.splice(i,1);
  if(p.anchorDay>p.cycle.length) p.anchorDay=1;
  if(planOpenIdx===i) planOpenIdx=-1; else if(planOpenIdx>i) planOpenIdx--;
  save(); render();
}
/* Neue Einheit anlegen + an den Zyklus anhängen */
function addUnit(){
  const p=activePlan();
  const uid='u_'+makeId();
  state.units[uid]={id:uid, name:'Neue Einheit', type:'other', exercises:[]};
  p.cycle.push(uid);
  planOpenIdx=p.cycle.length-1;
  save(); render();
}
function move(i,dir){
  const p=activePlan(), c=p.cycle, j=i+dir;
  if(j<0||j>=c.length) return;
  [c[i],c[j]]=[c[j],c[i]];
  if(planOpenIdx===i) planOpenIdx=j; else if(planOpenIdx===j) planOpenIdx=i;
  save(); render();
}
/* Übung innerhalb einer Einheit hoch/runter verschieben */
function moveExercise(unitId,exId,dir){
  const u=unitById(unitId); if(!u||!Array.isArray(u.exercises)) return;
  const i=u.exercises.findIndex(e=>e.id===exId); if(i<0) return;
  const j=i+dir;
  if(j<0||j>=u.exercises.length) return;
  [u.exercises[i],u.exercises[j]]=[u.exercises[j],u.exercises[i]];
  save(); render();
}
function toggleNote(i){ if(editing) return; openNoteIdx=(openNoteIdx===i)?-1:i; render(); }
function updateNote(v){ autoresize('.note-ta'); }
function autoresize(sel){ const ta=document.querySelector(sel); if(ta){ ta.style.height='auto'; ta.style.height=ta.scrollHeight+'px'; } }

function toggleDone(){
  const iso=todayISO();
  if(!state.log[iso]) state.log[iso]={};
  const e=state.log[iso];
  if(e.done){ e.done=false; }
  else{
    e.done=true;
    const p=activePlan();
    const uid=todayUnitId();
    const u=unitById(uid);
    e.planId=p.id; e.unitId=uid; e.type=u?u.type:'other';
    // KEIN automatisches Vorausfüllen aller Übungen mehr!
    // Nur tatsächlich abgehakte Übungen (mit echten Werten) bleiben erfasst.
  }
  save(); render();
}
function updateSessionNote(v){
  const iso=todayISO();
  if(!state.log[iso]) state.log[iso]={};
  state.log[iso].sessionNote=v; save();
  autoresize('.note-ta');
}
function insertCardioTpl(){
  const iso=todayISO();
  if(!state.log[iso]) state.log[iso]={};
  state.log[iso].sessionNote=CARDIO_TPL; save(); render();
}
function saveWeight(){
  const kgEl=document.getElementById('w-kg'), bfEl=document.getElementById('w-bf'), dEl=document.getElementById('w-date');
  const kg=parseFloat((kgEl.value||'').replace(',','.'));
  if(isNaN(kg)) { kgEl.focus(); return; }
  const bfRaw=(bfEl.value||'').replace(',','.');
  const bf=bfRaw!==''?parseFloat(bfRaw):null;
  const iso=(dEl&&dEl.value)?dEl.value:(weightDate||todayISO());
  const i=state.weight.findIndex(w=>w.date===iso);
  const entry={date:iso, kg:Math.round(kg*10)/10};
  if(bf!=null&&!isNaN(bf)) entry.bf=Math.round(bf*10)/10;
  if(i>=0) state.weight[i]=entry; else state.weight.push(entry);
  state.weight.sort((a,b)=>a.date.localeCompare(b.date));
  weightDate=todayISO();
  save(); render();
}

/* utils */
function fmt(n){ return (Math.round(n*10)/10).toLocaleString('de-DE'); }
function escapeHtml(s){ return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function escapeAttr(s){ return (s||'').replace(/["&<>]/g,c=>({'"':'&quot;','&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function short(s,n){ n=n||16; return s.length>n?s.slice(0,n-1)+'\u2026':s; }

(async function init(){ await load(); render(); })();

/* Pull-to-Refresh (eigener, da der Scroll im #app-Container läuft) */
(function initPullToRefresh(){
  const app=document.getElementById('app');
  const ptr=document.getElementById('ptr');
  if(!app||!ptr) return;
  let startY=0, pulling=false, dist=0;
  const TH=70, MAX=110;
  app.addEventListener('touchstart',function(e){
    if(app.scrollTop<=0 && e.touches.length===1){ startY=e.touches[0].clientY; pulling=true; dist=0; ptr.classList.remove('snap'); }
    else { pulling=false; }
  },{passive:true});
  app.addEventListener('touchmove',function(e){
    if(!pulling) return;
    if(app.scrollTop>0){ pulling=false; ptr.style.transform='translateY(-60px)'; return; }
    const dy=e.touches[0].clientY-startY;
    if(dy<=0){ dist=0; ptr.style.transform='translateY(-60px)'; return; }
    dist=Math.min(dy*0.5, MAX);
    ptr.style.transform='translateY('+(dist-60)+'px)';
    ptr.style.opacity=Math.min(dist/TH,1);
  },{passive:true});
  function end(){
    if(!pulling) return;
    pulling=false;
    ptr.classList.add('snap');
    if(dist>=TH){
      ptr.style.transform='translateY(12px)';
      ptr.classList.add('spin');
      setTimeout(function(){ location.reload(); },350);
    } else {
      ptr.style.transform='translateY(-60px)';
    }
  }
  app.addEventListener('touchend',end,{passive:true});
  app.addEventListener('touchcancel',end,{passive:true});
})();
</script>
